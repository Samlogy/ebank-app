# ELK overlay — compose on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.elk.yml up -d
#
# Services added: elasticsearch, logstash, kibana
# App service is patched to forward logs to Logstash via TCP.
#
# Ports exposed on the host:
#   9200  Elasticsearch REST API
#   5601  Kibana UI          → http://localhost:5601
#   5000  Logstash TCP input (internal — not normally needed from host)

services:

  # ── Elasticsearch ────────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ebank_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # no TLS/auth for dev; enable in prod
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ebank-network

  # ── Logstash ─────────────────────────────────────────────────────────────────
  logstash:
    image: logstash:8.13.4
    container_name: ebank_logstash
    restart: unless-stopped
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5000:5000/tcp"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ebank-network

  # ── Kibana ───────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.13.4
    container_name: ebank_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - ebank-network

  # ── Patch the app to send logs to Logstash ───────────────────────────────────
  app:
    environment:
      LOGSTASH_HOST: logstash
    depends_on:
      logstash:
        condition: service_started   # don't block app startup if Logstash is slow

networks:
  ebank-network:
    driver: bridge

volumes:
  es_data:
