# HorizontalPodAutoscaler — scales pods based on CPU usage.
# Requires the Metrics Server addon in Minikube:
#   minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ebank-monolith-hpa
  namespace: ebank
  labels:
    app: ebank-monolith
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ebank-monolith
  minReplicas: 2   # Always run at least 2 for high availability
  maxReplicas: 5   # Scale up to 5 under load
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale when average CPU > 70%
