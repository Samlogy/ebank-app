# ─────────────────────────────────────────────────────────────────────────────
# SECRET TEMPLATE — do NOT commit real values to Git.
#
# HOW TO USE:
#   Option A (Jenkins): inject via Jenkins credentials + envsubst in Jenkinsfile
#   Option B (manual):  base64-encode each value, then kubectl apply -f secret.yaml
#
# Base64 encoding example:
#   echo -n 'mypassword' | base64
#
# In production, prefer a secrets manager (Vault, AWS Secrets Manager, Sealed Secrets)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ebank-monolith-secret
  namespace: ebank
  labels:
    app: ebank-monolith
type: Opaque
data:
  # Replace each value with: echo -n 'your-value' | base64
  SPRING_DATASOURCE_USERNAME: REPLACE_BASE64_ENCODED_VALUE
  SPRING_DATASOURCE_PASSWORD: REPLACE_BASE64_ENCODED_VALUE

  # JWT signing key — must be at least 64 characters (512-bit) for HS512
  JWT_SECRET: REPLACE_BASE64_ENCODED_VALUE

  # Optional: seed admin user (leave blank to skip creation)
  ADMIN_EMAIL:    REPLACE_BASE64_ENCODED_VALUE
  ADMIN_PASSWORD: REPLACE_BASE64_ENCODED_VALUE
