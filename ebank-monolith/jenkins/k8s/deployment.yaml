# IMAGE_FULL is replaced at deploy time by the Jenkins pipeline using envsubst:
#   IMAGE_FULL=yourdockerhub/ebank-monolith:main-a3f9c12-42 envsubst '$IMAGE_FULL' < deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebank-monolith
  namespace: ebank
  labels:
    app: ebank-monolith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ebank-monolith
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # Allow 1 extra pod during rollout (zero-downtime)
      maxUnavailable: 0   # Never take a pod down before the new one is ready
  template:
    metadata:
      labels:
        app: ebank-monolith
    spec:
      # Run as non-root — matches the Dockerfile USER ebank declaration
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: ebank-monolith
          image: $IMAGE_FULL
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment from ConfigMap ──────────────────────────
          envFrom:
            - configMapRef:
                name: ebank-monolith-config
            - secretRef:
                name: ebank-monolith-secret

          # ── Resource requests & limits ──────────────────────────
          resources:
            requests:
              cpu: "250m"      # 0.25 vCPU guaranteed
              memory: "512Mi"
            limits:
              cpu: "500m"      # 0.5 vCPU max
              memory: "1Gi"

          # ── Liveness probe — restarts pod if app is stuck ───────
          # Requires spring.boot.actuator management.endpoint.health.probes.enabled=true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60   # Spring Boot can be slow to start
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          # ── Readiness probe — gates traffic until app is ready ──
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          # ── Startup probe — extra grace period on cold start ────
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 12    # 12 × 10s = 2 min max startup time
            periodSeconds: 10

          # ── Container security ──────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ── Writable temp dir (needed for Spring Boot's Tomcat) ─
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}
