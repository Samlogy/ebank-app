# ─────────────────────────────────────────────────────────────────────────────
# SUPPLEMENTARY — for manual / emergency kubectl deployments only.
# The standard deployment path is the Helm chart at ebank-monolith/helm/.
#
# With Vault integration all runtime config (datasource, JPA, JWT, admin
# credentials, rate-limits, logging) is loaded from Vault at startup:
#   secret/e-bank/monolith/<VAULT_ENV_ID>/config
#
# This ConfigMap holds only the non-secret, non-Vault env vars the app needs
# before it can reach Vault: the Spring profile selector and Vault coordinates.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebank-monolith-config
  namespace: ebank
  labels:
    app: ebank-monolith
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  # Vault connection — non-secret; tells the app where to fetch all other config.
  VAULT_HOST: "vault.prod.example.com"   # ← replace with your Vault address
  VAULT_PORT: "8200"
  VAULT_SCHEME: "https"
  VAULT_ENV_ID: "E1"                     # E1 = prod, E2 = dev/testing
