apiVersion: v1
kind: ConfigMap
metadata:
  name: ebank-monolith-config
  namespace: ebank
  labels:
    app: ebank-monolith
data:
  # Spring profile to activate
  SPRING_PROFILES_ACTIVE: "prod"

  # Server
  SERVER_PORT: "8080"

  # PostgreSQL connection (host = K8s service name for Postgres pod)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/ebank_dev"

  # HikariCP connection pool
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"

  # JPA
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"

  # Actuator (liveness + readiness probes)
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

  # Logging
  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_COM_EBANK: "INFO"
