# ── App of Apps bootstrap ─────────────────────────────────────────────────────
#
# Apply this single manifest to seed the entire GitOps setup:
#
#   kubectl apply -f ebank-monolith/gitops/argocd/bootstrap.yaml
#
# Argo CD will discover the AppProject and every Application in the
# gitops/argocd/apps/ directory and manage them automatically.
#
# Apply order:
#   1. kubectl apply -f bootstrap.yaml          (creates the bootstrap App)
#   2. Argo CD syncs → creates project.yaml + apps/ebank-monolith-*.yaml
#   3. Argo CD syncs each Application → deploys the workloads
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebank-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
  labels:
    app.kubernetes.io/part-of: ebank
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # sync before child Applications
spec:
  project: default   # bootstrap lives in default until the ebank project is created

  source:
    repoURL: https://github.com/samlogy/ebank-app
    # targetRevision points to the branch Argo CD should track.
    # Change to 'main' once the gitops/ebank-monolith branch is merged.
    targetRevision: gitops/ebank-monolith
    path: ebank-monolith/gitops/argocd
    directory:
      recurse: true        # picks up project.yaml + apps/*.yaml
      include: "*.yaml"
      exclude: "bootstrap.yaml"   # exclude self to avoid recursion

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true        # remove Applications no longer in Git
      selfHeal: true     # revert manual edits to Argo CD resources
    syncOptions:
      - CreateNamespace=false   # argocd namespace must already exist
      - ApplyOutOfSyncOnly=true
