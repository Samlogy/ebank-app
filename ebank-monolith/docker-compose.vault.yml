# Vault overlay — runs the 'dev' Spring profile against a local Vault dev server.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d --build
#
# What it does:
#   1. Starts Vault in dev mode (ephemeral data, root token = "root")
#   2. Runs vault-init once: mounts KV v2, seeds E2 config, creates AppRole
#   3. Starts the app with the 'dev' profile
#
# Auth note:
#   The 'dev' Spring profile uses AppRole in real deployments. Here we override
#   it to Token auth via SPRING_CLOUD_VAULT_* env vars so docker-compose does not
#   need to coordinate dynamically generated AppRole credentials between containers.
#   Real dev/prod deployments always use AppRole (see application-dev.yaml).
#
# Vault UI: http://localhost:8200  (token: root)

services:

  vault:
    image: hashicorp/vault:1.17
    container_name: ebank_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ebank-network

  vault-init:
    image: hashicorp/vault:1.17
    container_name: ebank_vault_init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: root
    volumes:
      - ./vault:/vault-config:ro
    entrypoint: ["sh", "/vault-config/init.sh"]
    networks:
      - ebank-network

  app:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      VAULT_ENV_ID: E2
      # Override the dev profile's AppRole auth with Token for this local stack.
      # The SPRING_CLOUD_VAULT_* env vars take precedence over application-dev.yaml.
      SPRING_CLOUD_VAULT_AUTHENTICATION: TOKEN
      SPRING_CLOUD_VAULT_TOKEN: root
      SPRING_CLOUD_VAULT_HOST: vault
      SPRING_CLOUD_VAULT_PORT: 8200
      SPRING_CLOUD_VAULT_SCHEME: http
    depends_on:
      vault-init:
        condition: service_completed_successfully
