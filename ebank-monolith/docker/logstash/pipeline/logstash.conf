input {
  # Receives JSON events from logstash-logback-encoder over TCP
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # @timestamp is already an ISO-8601 string set by logstash-logback-encoder;
  # Logstash parses it automatically via the json_lines codec.

  # Promote MDC fields to top-level for easier Kibana filtering
  if [mdc][correlationId] { mutate { add_field => { "correlationId" => "%{[mdc][correlationId]}" } } }
  if [mdc][userId]        { mutate { add_field => { "userId"        => "%{[mdc][userId]}"        } } }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ebank-logs-%{+YYYY.MM.dd}"
  }
}
