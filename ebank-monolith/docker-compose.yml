# ebank unified docker-compose
#
# Includes: PostgreSQL, Spring Boot App, Vault, ELK Stack, Prometheus, Grafana, Tempo
#
# Usage:
#   docker compose up -d                                    # Run base stack (postgres + app)
#   docker compose --profile vault up -d                    # Add Vault
#   docker compose --profile elk up -d                      # Add ELK
#   docker compose --profile monitoring up -d               # Add Prometheus + Grafana + Tempo
#   docker compose --profile vault --profile elk up -d      # Vault + ELK
#   docker compose --profile "*" up -d                      # Run everything
#

services:

  # ═══════════════════════════════════════════════════════════════════════════════
  # Core Services (always active)
  # ═══════════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ebank_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ebank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ebank-network


  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ebank_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ebank-network


  # ═══════════════════════════════════════════════════════════════════════════════
  # Vault Profile Services
  # ═══════════════════════════════════════════════════════════════════════════════

  # ── Vault Development Server ──────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: ebank_vault
    # profiles: [vault]
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: http://localhost:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/v1/sys/health | grep -q 'initialized' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ebank-network

  # ── Vault Initialization (seeds secrets) ───────────────────────────────────
  vault-init:
    image: hashicorp/vault:1.17
    container_name: ebank_vault_init
    # profiles: [vault]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: root
    volumes:
      - ./vault:/vault-config:ro
    entrypoint: ["sh", "/vault-config/init.sh"]
    networks:
      - ebank-network

  # ═══════════════════════════════════════════════════════════════════════════════
  # ELK Stack Profile Services
  # ═══════════════════════════════════════════════════════════════════════════════

  # ── Elasticsearch ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ebank_elasticsearch
    # profiles: [elk]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ebank-network

  # ── Logstash ──────────────────────────────────────────────────────────────────
  logstash:
    image: logstash:8.13.4
    container_name: ebank_logstash
    # profiles: [elk]
    restart: unless-stopped
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5000:5000/tcp"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ebank-network

  # ── Kibana ────────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.13.4
    container_name: ebank_kibana
    # profiles: [elk]
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - ebank-network

  # ═══════════════════════════════════════════════════════════════════════════════
  # Monitoring Profile Services (Prometheus, Grafana, Tempo)
  # ═══════════════════════════════════════════════════════════════════════════════

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ebank_prometheus
    # profiles: [monitoring]
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./docker/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ebank-network

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ebank_grafana
    # profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ebank-network

  # ── Tempo (Distributed Tracing) ───────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: ebank_tempo
    # profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/config/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - app
    networks:
      - ebank-network

  # ── Spring Boot Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebank_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Default profile is 'prod'; override via .env or command line when using 'vault' profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL:  jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST:      redis
      SPRING_REDIS_PORT:      6379
      SPRING_REDIS_PASSWORD:  ${REDIS_PASSWORD:-}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ADMIN_EMAIL:            ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD:         ${ADMIN_PASSWORD:-}
      SERVER_PORT:            8080
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      # ELK/Logstash configuration (used when ELK profile is enabled)
      LOGSTASH_HOST:          ${LOGSTASH_HOST:-localhost}
      LOGSTASH_PORT:          ${LOGSTASH_PORT:-5000}
      # Vault configuration (used when Vault profile is enabled)
      VAULT_HOST:             ${VAULT_HOST:-localhost}
      VAULT_PORT:             ${VAULT_PORT:-8200}
      VAULT_SCHEME:           ${VAULT_SCHEME:-http}
      VAULT_ENV_ID:           ${VAULT_ENV_ID:-E2}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ebank-network


networks:
  ebank-network:
    driver: bridge

volumes:
  ebank_postgres_data:
  es_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  # Redis is intentionally ephemeral — cache data does not need to survive restarts