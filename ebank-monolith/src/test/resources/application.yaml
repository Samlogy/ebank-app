# Base test overrides — always applied during test runs regardless of active profile
spring:
  datasource:
    # H2 in PostgreSQL compatibility mode so Flyway migrations run unmodified
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Force H2 dialect so Hibernate doesn't try to connect as PostgreSQL
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    # Placeholders clash with H2's own ${} syntax — disable them in SQL scripts
    placeholder-replacement: false

  # Vault is never used in tests
  cloud:
    vault:
      enabled: false
