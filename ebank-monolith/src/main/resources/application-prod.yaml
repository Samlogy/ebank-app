# Profile: prod
# Activated by: SPRING_PROFILES_ACTIVE=prod  (set in docker-compose.yml)
# All sensitive values must come from environment variables — no defaults here.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      # Never auto-modify schema in production — fail fast if schema is wrong
      ddl-auto: validate
    show-sql: false

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

logging:
  level:
    root: WARN
    com.ebank: INFO

management:
  endpoints:
    web:
      exposure:
        # Expose only health in production — info may leak version/config
        include: health
