# Profile: local
# Usage: SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
# Requires: docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d
#
# All runtime config (datasource, jwt, logging, etc.) is loaded from Vault at:
#   secret/e-bank/monolith/${VAULT_ENV_ID:local}/config
# Seed that path first with: vault/init.sh (run automatically by docker-compose.vault.yml)

spring:
  config:
    import: "vault://"
  cloud:
    vault:
      enabled: true
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        default-context: "e-bank/monolith/${VAULT_ENV_ID:local}/config"
        backend-version: 2
      connection-timeout: 5000
      read-timeout: 15000
