# Profile: local
# Usage: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Requires: docker compose up postgres  (PostgreSQL on localhost:5432)

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ebank_dev
    username: ebank_user
    password: ebank_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
    com.ebank: DEBUG
    org.hibernate.SQL: DEBUG
