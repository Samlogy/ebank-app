spring:
  application:
    name: ebank-monolith

  datasource:
    # Fallback values used when no profile is active (e.g. bare integration tests).
    # When the local or prod profile is active these are overridden by Vault.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebank_dev}
    username: ${SPRING_DATASOURCE_USERNAME:ebank_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ebank_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

  # Vault is disabled at the base level; each profile enables it.
  cloud:
    vault:
      enabled: false
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:http}
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        enabled: true
        backend: secret
        # VAULT_ENV_ID selects the environment path: local | E1 | E2 | …
        default-context: "e-bank/monolith/${VAULT_ENV_ID:local}/config"
        backend-version: 2

server:
  port: ${SERVER_PORT:8080}

jwt:
  expiration: 86400000   # 24 h in ms — overridden per environment via Vault

rate-limiting:
  login:
    capacity: 10
    refill-minutes: 1

admin:
  email: ""
  password: ""

logging:
  level:
    root: INFO
    com.ebank: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
