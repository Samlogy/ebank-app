spring:
  application:
    name: ebank-monolith

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebank_dev}
    username: ${SPRING_DATASOURCE_USERNAME:ebank_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ebank_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10          # 2×vCPU + 1 is a good starting point; tune under load
      minimum-idle: 5                # keep 5 warm so bursts don't pay connection-open cost
      connection-timeout: 3000       # fail fast (3 s) rather than piling up waiting threads
      idle-timeout: 300000           # release idle connections after 5 min
      max-lifetime: 900000           # recycle connections after 15 min (less than any DB-side timeout)
      leak-detection-threshold: 5000 # WARN if a connection is held > 5 s (catches missing close/flush)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

server:
  port: ${SERVER_PORT:8080}

jwt:
  expiration: 86400000   # 24 h in ms

# Per-IP token bucket on POST /api/v1/auth/login
rate-limiting:
  login:
    capacity: 10
    refill-minutes: 1

# Seed an ADMIN user on first startup when both values are non-empty
admin:
  email: ""
  password: ""

logging:
  level:
    root: INFO
    com.ebank: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
