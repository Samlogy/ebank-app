spring:
  application:
    name: ebank-monolith

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebank_dev}
    username: ${SPRING_DATASOURCE_USERNAME:ebank_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ebank_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

server:
  port: ${SERVER_PORT:8080}

jwt:
  # HS512 requires >= 64 bytes. Generate production secret: openssl rand -hex 64
  secret: ${JWT_SECRET:dev-local-development-only-jwt-secret-key-replace-me-in-production}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.ebank: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
