spring:
  application:
    name: ebank-monolith

  datasource:
    # Fallback values used when no profile is active (e.g. bare integration tests).
    # When the local or prod profile is active these are overridden by Vault.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebank_dev}
    username: ${SPRING_DATASOURCE_USERNAME:ebank_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ebank_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 5000

  jpa:
    open-in-view: false   # disable OSIV — avoids lazy-load surprises and thread contention
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

  # Redis — host/port/password injected per environment; Vault overrides in dev/prod
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      connect-timeout: 2000
      timeout: 1000

  cache:
    type: redis

  # Spring Boot Admin client — disabled by default; enabled per-environment via env var or Vault
  boot:
    admin:
      client:
        enabled: ${SPRING_BOOT_ADMIN_ENABLED:false}
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8090}
        username: ${SPRING_BOOT_ADMIN_USERNAME:admin}
        password: ${SPRING_BOOT_ADMIN_PASSWORD:admin}
        instance:
          # URL the admin server uses to reach back to this app's actuator endpoints
          service-base-url: ${SPRING_APP_BASE_URL:http://localhost:${server.port:8080}}
          prefer-ip: true
          name: ${spring.application.name}
          metadata:
            environment: ${spring.profiles.active:default}

  # Java 21 virtual threads — dramatically reduces thread overhead under load
  threads:
    virtual:
      enabled: true

  # Vault is disabled at the base level.
  # Profile 'dev'  → enables Vault, AppRole auth, reads E2 path.
  # Profile 'prod' → enables Vault, AppRole auth, reads E1 path.
  # Profile 'local'→ does NOT use Vault; all config is in application-local.yaml.
  cloud:
    vault:
      enabled: false
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:https}
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        enabled: true
        backend: secret
        # VAULT_ENV_ID selects the Vault path: E2 (dev) | E1 (prod)
        default-context: "e-bank/monolith/${VAULT_ENV_ID:E2}/config"
        backend-version: 2

server:
  port: ${SERVER_PORT:8080}

jwt:
  expiration: 86400000   # 24 h in ms — overridden per environment via Vault

rate-limiting:
  login:
    capacity: 10
    refill-minutes: 1

admin:
  email: ""
  password: ""

logging:
  level:
    root: INFO
    com.ebank: DEBUG

management:
  endpoints:
    web:
      exposure:
        # Exposes all endpoints needed by Spring Boot Admin.
        # In dev/prod, Vault overrides this to a tighter set.
        include: health,info,metrics,prometheus,loggers,env,caches,threaddump,flyway,scheduledtasks,conditions,configprops,beans,mappings
  endpoint:
    health:
      show-details: always          # required for Spring Boot Admin health detail panel
      probes:
        enabled: true               # /actuator/health/liveness + /readiness
    env:
      show-values: never            # never leak secret values through /actuator/env
    loggers:
      enabled: true                 # log-level changes at runtime via Spring Boot Admin
    caches:
      enabled: true                 # Redis cache stats in Spring Boot Admin
