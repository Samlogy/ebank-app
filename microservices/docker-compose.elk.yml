# ELK overlay — full-text log search, on top of the default Loki setup.
#
#   docker compose -f docker-compose.yml -f docker-compose.elk.yml up -d
#
# Services added: elasticsearch, logstash, kibana, filebeat.
# Filebeat tails Docker's stdout logs for the 5 ebank_* app containers
# (container names ending in "_service") and ships them to Logstash — no
# code changes needed in the services themselves, they already log JSON/
# logfmt to stdout for `docker logs`.
#
# Ports exposed on the host:
#   9200  Elasticsearch REST API
#   5601  Kibana UI          → http://localhost:5601
#   5044  Logstash Beats input (internal — not normally needed from host)
#
# Trade-off vs the default Loki stack: see infra/elk/README.md.

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ebank_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # no TLS/auth for dev; enable in prod
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ebank-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: ebank_logstash
    restart: unless-stopped
    volumes:
      - ./infra/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./infra/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ebank-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: ebank_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - ebank-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: ebank_filebeat
    user: root                            # required to read /var/lib/docker/containers
    restart: unless-stopped
    entrypoint: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./infra/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      logstash:
        condition: service_started        # don't block Filebeat startup on Logstash readiness
    networks:
      - ebank-network

networks:
  ebank-network:
    driver: bridge

volumes:
  es-data:
