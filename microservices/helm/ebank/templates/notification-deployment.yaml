{{/*
notification-deployment.yaml — Node.js Kafka consumer + email/SMS sender

WHY different from Spring services:
  - No Spring Cloud Config → does NOT wait for config-server (initContainer omitted)
  - No Vault Spring integration → env vars passed directly OR read from K8s Secret
  - Health check on /health (Express endpoint), not /actuator/health
  - Kafka consumer: scaling replicas = scaling Kafka consumer group members.
    Only scale if topic has enough partitions (1 consumer per partition max).
    Default: 1 replica to avoid duplicate email delivery.
*/}}
{{- if .Values.notification.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebank.fullname" . }}-notification
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
spec:
  replicas: {{ .Values.notification.replicas }}
  selector:
    matchLabels:
      {{- include "ebank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ebank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notification
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum | trunc 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification
          image: {{ include "ebank.image" (dict "service" .Values.notification "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.notification.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.notification.port | quote }}
            # Kafka — uses Bitnami service name computed from release name
            - name: KAFKA_BROKERS
              value: "{{ include "ebank.kafkaHost" . }}:9092"
            - name: KAFKA_GROUP_ID
              value: "notification-group"
            # SMTP
            - name: SMTP_HOST
              value: {{ .Values.notification.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.notification.smtp.port | quote }}
            - name: SMTP_FROM
              value: {{ .Values.notification.smtp.from | quote }}
            # Twilio (optional) — inject from K8s Secret in prod
            # kubectl create secret generic twilio-secret \
            #   --from-literal=sid=... --from-literal=token=...
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: twilio-secret
                  key: sid
                  optional: true       # optional: missing secret → env var is empty
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: twilio-secret
                  key: token
                  optional: true
            # Observability — see k8s/tempo-local.yaml (local/minikube).
            # Both exporters are fire-and-forget: the pod starts fine even if
            # Tempo/Loki aren't reachable, same as the Java services' OTLP export.
            - name: OTEL_SERVICE_NAME
              value: "notification-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.{{ .Release.Namespace }}.svc.cluster.local:4318/v1/traces"
            - name: LOKI_URL
              value: "http://loki.{{ .Release.Namespace }}.svc.cluster.local:3100/loki/api/v1/push"

          resources:
            {{- toYaml .Values.notification.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.notification.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.notification.probes.liveness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.notification.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.notification.probes.readiness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5
{{- end }}
