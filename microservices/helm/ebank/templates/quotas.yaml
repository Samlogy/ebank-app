{{/*
quotas.yaml — ResourceQuota + LimitRange for the ebank namespace.

ResourceQuota:  hard cap on total CPU/memory/pod count the namespace can consume.
                Prevents one runaway service from exhausting the cluster node.
LimitRange:     default request/limit injected into every container that omits them.
                Without this, containers with no resource spec get unlimited access.

WHY both?
  ResourceQuota fails the Pod if the namespace total would be exceeded.
  LimitRange ensures every container has a spec so the quota arithmetic works.
  Together they make resource accounting deterministic.
*/}}
{{- if .Values.quotas.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ebank.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
spec:
  hard:
    # CPU: sum of all container requests across the namespace
    requests.cpu:    {{ .Values.quotas.requests.cpu | quote }}
    requests.memory: {{ .Values.quotas.requests.memory | quote }}
    # Limits are the hard ceiling — containers cannot burst beyond this
    limits.cpu:      {{ .Values.quotas.limits.cpu | quote }}
    limits.memory:   {{ .Values.quotas.limits.memory | quote }}
    # Cap total number of pods (guards against infinite replica loops)
    pods: {{ .Values.quotas.maxPods | quote }}
    # Cap K8s objects to prevent runaway automation
    services:               {{ .Values.quotas.maxServices | quote }}
    persistentvolumeclaims: {{ .Values.quotas.maxPVCs | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "ebank.fullname" . }}-limits
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      # Injected when a container spec omits requests/limits entirely
      defaultRequest:
        cpu:    {{ .Values.quotas.defaultRequest.cpu | quote }}
        memory: {{ .Values.quotas.defaultRequest.memory | quote }}
      default:
        cpu:    {{ .Values.quotas.defaultLimit.cpu | quote }}
        memory: {{ .Values.quotas.defaultLimit.memory | quote }}
      # Hard min/max per container (prevents 0-request tricks and runaway limits)
      min:
        cpu:    "10m"
        memory: "16Mi"
      max:
        cpu:    {{ .Values.quotas.maxPerContainer.cpu | quote }}
        memory: {{ .Values.quotas.maxPerContainer.memory | quote }}
    - type: Pod
      # A single pod cannot exceed these regardless of its container count
      max:
        cpu:    {{ .Values.quotas.maxPerPod.cpu | quote }}
        memory: {{ .Values.quotas.maxPerPod.memory | quote }}
{{- end }}
