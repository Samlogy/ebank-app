{{/*
servicemonitor.yaml — Tells kube-prometheus-stack to scrape ebank's Spring
Boot services' /actuator/prometheus.

HOW it works:
  Prometheus Operator watches ServiceMonitor CRDs cluster-wide.
  When it finds one, it generates a Prometheus scrape config targeting
  the Service endpoints matching the selector labels.

WHY one ServiceMonitor for the Spring Boot services (not per-service):
  auth/accounts/transactions/gateway all expose the same path on the same
  label (app.kubernetes.io/instance: ebank). One resource is simpler and
  scales automatically when a new Spring Boot service is added.

WHY notification-service is excluded here:
  It's Node.js and exposes Prometheus metrics at /metrics, not
  /actuator/prometheus — scraping it with this path would just 404.
  See notification-servicemonitor.yaml for its dedicated ServiceMonitor.

REQUIRES: kube-prometheus-stack or prometheus-operator installed.
  helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ebank.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    # This label is required by kube-prometheus-stack's Prometheus instance
    # to discover ServiceMonitors. The default selector is:
    #   serviceMonitorSelector: { matchLabels: { release: monitoring } }
    release: monitoring
spec:
  # Select all Services in this namespace that belong to this Helm release,
  # except notification (Node — different path, see notification-servicemonitor.yaml)
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["notification"]
  # Only scrape the namespace where the release lives
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http                          # matches the port name in Service templates
      path: /actuator/prometheus          # Spring Boot Prometheus endpoint
      interval: {{ .Values.monitoring.scrapeInterval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
      # Honor labels from the app (service name, env, etc.)
      honorLabels: false
      relabelings:
        # Add kubernetes namespace label to every metric
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        # Add pod name for per-instance drilldown
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        # Add service name as "job" label (Grafana uses this for filtering)
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: job
          replacement: ${1}
{{- end }}
