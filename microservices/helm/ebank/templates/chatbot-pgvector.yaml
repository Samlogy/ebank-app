{{- if .Values.chatbot.enabled }}
# Dedicated pgvector Postgres for the chatbot RAG store (Database-per-Service).
# Kept separate from the main Bitnami Postgres because that image does not ship
# the `vector` extension. Demo storage is ephemeral (emptyDir); vectors are
# re-ingested on restart (idempotent).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebank.fullname" . }}-chatbot-pgvector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot-pgvector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ebank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chatbot-pgvector
  template:
    metadata:
      labels:
        {{- include "ebank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chatbot-pgvector
    spec:
      containers:
        - name: pgvector
          image: {{ .Values.chatbot.pgvector.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.chatbot.db.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.chatbot.db.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.chatbot.db.name | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.chatbot.db.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebank.fullname" . }}-chatbot-pgvector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot-pgvector
spec:
  type: ClusterIP
  selector:
    {{- include "ebank.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot-pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
