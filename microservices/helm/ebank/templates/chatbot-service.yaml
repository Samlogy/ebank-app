{{- if .Values.chatbot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebank.fullname" . }}-chatbot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
spec:
  type: ClusterIP
  selector:
    {{- include "ebank.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
  ports:
    - name: http
      port: {{ .Values.chatbot.port }}
      targetPort: http
      protocol: TCP
{{- end }}
