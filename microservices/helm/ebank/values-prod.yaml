# ══════════════════════════════════════════════════════════════════════════════
# values-prod.yaml — PRODUCTION environment overrides
# Goal: HA, right-sized resources, autoscaling enabled
# Apply ON TOP of values.yaml:
#   helm upgrade --install ebank ./helm/ebank \
#     -f helm/ebank/values.yaml \
#     -f helm/ebank/values-prod.yaml \
#     --namespace ebank-prod --create-namespace \
#     --set global.imageTag=$GIT_SHA \
#     --set global.vault.token=$VAULT_TOKEN
# ══════════════════════════════════════════════════════════════════════════════

global:
  env: "prod"
  registry: "your-registry"
  vault:
    addr: "http://vault.ebank-infra.svc.cluster.local:8200"

# ── Auth ──────────────────────────────────────────────────────────────────────
auth:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1.5Gi" }

# ── Accounts ───────────────────────────────────────────────────────────────────
accounts:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1.5Gi" }

# ── Transactions ───────────────────────────────────────────────────────────────
transactions:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1.5Gi" }

# ── Notification — scale only if Kafka topic has enough partitions ─────────────
notification:
  replicas: 2
  resources:
    requests: { cpu: "150m", memory: "128Mi" }
    limits:   { cpu: "400m", memory: "256Mi" }
  smtp:
    host: "smtp.sendgrid.net"    # replace MailHog with real SMTP in prod
    port: "587"
    from: "noreply@ebank.com"

# ── Gateway ────────────────────────────────────────────────────────────────────
gateway:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 60
  resources:
    requests: { cpu: "400m", memory: "512Mi" }
    limits:   { cpu: "1500m", memory: "1.5Gi" }
  ingress:
    host: api.ebank.com
    tls: true
    tlsSecretName: ebank-gateway-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

# ── Frontend ───────────────────────────────────────────────────────────────────
frontend:
  replicas: 3
  resources:
    requests: { cpu: "100m", memory: "64Mi" }
    limits:   { cpu: "300m", memory: "128Mi" }
  ingress:
    host: ebank.com
    tls: true
    tlsSecretName: ebank-frontend-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

# ── Infrastructure — larger disks, HA Kafka ────────────────────────────────────
# TIP: In cloud prod, disable these and use managed services instead:
#   postgresql.enabled: false → use AWS RDS PostgreSQL
#   mongodb.enabled: false    → use MongoDB Atlas
#   redis.enabled: false      → use AWS ElastiCache
#   kafka.enabled: false      → use AWS MSK
postgresql:
  primary:
    persistence:
      size: 50Gi

mongodb:
  persistence:
    size: 50Gi

redis:
  master:
    persistence:
      size: 20Gi

kafka:
  replicaCount: 3             # 3 brokers for fault tolerance
  persistence:
    size: 50Gi

# ── Resource Quotas ────────────────────────────────────────────────────────────
quotas:
  enabled: true
  requests:    { cpu: "20",    memory: "40Gi" }
  limits:      { cpu: "40",    memory: "80Gi" }
  maxPods: "150"
  maxServices: "60"
  maxPVCs: "40"
  defaultRequest:     { cpu: "200m",   memory: "256Mi"  }
  defaultLimit:       { cpu: "1",      memory: "1.5Gi"  }
  maxPerContainer:    { cpu: "4",      memory: "4Gi"    }
  maxPerPod:          { cpu: "8",      memory: "8Gi"    }
