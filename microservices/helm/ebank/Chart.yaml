apiVersion: v2
name: ebank
description: |
  eBank Microservices Platform — Spring Boot 4 + Node.js services.
  Includes optional Bitnami sub-charts for PostgreSQL, MongoDB, Redis, Kafka.
  Vault is deployed separately (see helm/vault/).
type: application
version: 1.0.0
appVersion: "1.0.0"

# ──────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES — Bitnami charts for infrastructure
# WHY Bitnami: production-grade, actively maintained, covers StatefulSet,
#              PodDisruptionBudget, metrics, persistent volumes out of the box.
# Each dependency is toggled by <name>.enabled in values.yaml.
# In cloud environments (AWS/GCP/Azure), set enabled: false and point to
# managed services (RDS, Atlas, ElastiCache, MSK) via externalServices in values.
#
# HOW TO FETCH: run `helm dependency update ./helm/ebank` before install.
# ──────────────────────────────────────────────────────────────────────────────
dependencies:
  - name: postgresql
    version: "15.5.38"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  - name: mongodb
    version: "15.6.24"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: mongodb.enabled

  - name: redis
    version: "19.6.4"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled

  - name: kafka
    version: "29.3.4"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: kafka.enabled
