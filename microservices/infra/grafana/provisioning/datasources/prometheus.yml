# Grafana datasource provisioning — auto-loaded on container start
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus           # stable uid so Tempo's tracesToMetrics/serviceMap (datasourceUid: prometheus) resolves
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      # Exemplar support: metric data points carry a traceId → click to open trace in Tempo
      exemplarTraceIdDestinations:
        - name: traceId
          datasourceUid: tempo   # uid matches the Tempo datasource
