# Filebeat — tails Docker container stdout for the 5 ebank application
# services (container names all end in "_service") and ships to Logstash.
# Infra containers (postgres, kafka, vault, prometheus, ...) are excluded —
# their operational logs aren't application logs and would just add noise.
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        - condition:
            contains:
              docker.container.name: "_service"
          config:
            - type: container
              paths:
                - "/var/lib/docker/containers/${data.docker.container.id}/*.log"

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_stderr: true
