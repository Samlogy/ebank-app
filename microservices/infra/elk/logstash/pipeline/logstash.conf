# Logstash pipeline — receives container logs from Filebeat (beats input),
# normalises both log shapes emitted by the ebank services, and indexes
# them into Elasticsearch.
#
#   notification-service (Node/pino)  → already JSON            → json filter
#   gateway/auth/accounts/transaction
#     (Java/logback, "docker" profile) → logfmt-ish single line  → grok filter
#
# Both shapes carry traceId/spanId (see OBSERVABILITY docs) so a trace found
# in Tempo can be cross-referenced here by traceId in Kibana Discover.

input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] == "notification_service" {
    json {
      source => "message"
      target => "app"
    }
    mutate {
      rename => {
        "[app][traceId]" => "trace_id"
        "[app][spanId]"  => "span_id"
        "[app][level]"   => "log_level"
        "[app][service]" => "service"
        "[app][msg]"     => "log_message"
      }
    }
  } else {
    grok {
      match => {
        "message" => "level=%{LOGLEVEL:log_level}%{SPACE}service=%{NOTSPACE:service}%{SPACE}traceId=%{NOTSPACE:trace_id}%{SPACE}spanId=%{NOTSPACE:span_id}%{SPACE}logger=%{NOTSPACE:logger}%{SPACE}\|%{SPACE}%{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure_ebank"]
    }
  }

  if [trace_id] == "none" {
    mutate {
      remove_field => ["trace_id", "span_id"]
    }
  }

  mutate {
    add_field => { "env" => "docker" }
    remove_field => ["agent", "ecs", "input", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ebank-microservices-%{+YYYY.MM.dd}"
  }
}
