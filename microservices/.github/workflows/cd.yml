# ══════════════════════════════════════════════════════════════════════════════
# cd.yml — Continuous Deployment
#
# STAGING (recf):  auto-deploy on every push to main after CI passes
# PRODUCTION:      manual trigger only (workflow_dispatch) with approval gate
#
# Strategy used: Rolling Update (default Kubernetes strategy)
# WHY rolling (not blue/green or canary) for this project:
#   - Simpler: no extra infra needed
#   - Zero-downtime: new pods start before old pods stop
#   - Fast rollback: `helm rollback ebank <revision>` or re-push
#   - Blue/green and canary require service mesh or extra Ingress setup
#   - Suitable for a microservices app where each service is independent
#
# SECRETS required (set in GitHub → Settings → Secrets):
#   KUBE_CONFIG_RECF    — base64-encoded kubeconfig for staging cluster
#   KUBE_CONFIG_PROD    — base64-encoded kubeconfig for prod cluster
#   VAULT_TOKEN_RECF    — Vault token for staging
#   VAULT_TOKEN_PROD    — Vault token for production
# ══════════════════════════════════════════════════════════════════════════════
name: CD

on:
  # Auto-deploy to staging when CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Manual production deploy (requires manual trigger in GitHub UI)
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [recf, prod]
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ebank

jobs:
  # ── Deploy to Staging (recf) ─────────────────────────────────────────────────
  deploy-recf:
    name: Deploy → Staging (recf)
    runs-on: ubuntu-latest
    environment: recf           # GitHub environment with protection rules
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'recf')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (staging)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_RECF }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # Use the short SHA of the commit that triggered CI
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Helm dependency update
        run: helm dependency update helm/ebank

      - name: Deploy to staging
        run: |
          helm upgrade --install ebank ./helm/ebank \
            --namespace ebank-recf \
            --create-namespace \
            -f helm/ebank/values.yaml \
            -f helm/ebank/values-recf.yaml \
            --set global.imageTag=${{ steps.tag.outputs.tag }} \
            --set global.registry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set global.vault.token=${{ secrets.VAULT_TOKEN_RECF }} \
            --timeout 15m \
            --wait \
            --atomic     # rollback automatically if deploy fails

      - name: Smoke test staging
        run: |
          # Wait for gateway to be reachable
          GATEWAY_URL="https://api.recf.ebank.com"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$GATEWAY_URL/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging gateway healthy"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "❌ Staging smoke test failed"
          exit 1

  # ── Deploy to Production ─────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: prod             # GitHub environment — requires manual approval
    needs: deploy-recf            # prod only deploys after staging succeeds
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (production)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm dependency update
        run: helm dependency update helm/ebank

      - name: Deploy to production (rolling update)
        run: |
          helm upgrade --install ebank ./helm/ebank \
            --namespace ebank-prod \
            --create-namespace \
            -f helm/ebank/values.yaml \
            -f helm/ebank/values-prod.yaml \
            --set global.imageTag=${{ github.event.inputs.image_tag }} \
            --set global.registry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set global.vault.token=${{ secrets.VAULT_TOKEN_PROD }} \
            --timeout 20m \
            --wait \
            --atomic

      - name: Tag release in Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "prod-$(date +%Y%m%d-%H%M%S)-${{ github.event.inputs.image_tag }}"
          git push --tags
