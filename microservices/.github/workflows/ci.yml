# ══════════════════════════════════════════════════════════════════════════════
# ci.yml — Continuous Integration
#
# Triggers: every push and pull request to any branch.
# Jobs:
#   1. test    — compile + unit test each Java service in parallel (matrix)
#   2. build   — build & push Docker images (only on main branch)
#
# WHY matrix strategy:
#   All 4 Java services (auth, accounts, transactions, gateway) build in
#   parallel — 4× faster than sequential. Node service (notification) and
#   React (frontend) are separate matrix entries with different steps.
# ══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ebank

jobs:
  # ── 1. Test each service in parallel ────────────────────────────────────────
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # don't cancel other matrix jobs if one fails
      matrix:
        include:
          - service: auth
            dir: auth
            runtime: java
          - service: accounts
            dir: accounts
            runtime: java
          - service: transactions
            dir: transactions
            runtime: java
          - service: gateway
            dir: gateway
            runtime: java
          - service: notification
            dir: notifications
            runtime: node
          - service: frontend
            dir: frontend
            runtime: node

    steps:
      - uses: actions/checkout@v4

      # ── Java services ────────────────────────────────────────────────────
      - name: Set up JDK 21
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests (${{ matrix.service }})
        if: matrix.runtime == 'java'
        working-directory: ${{ matrix.dir }}
        # -pl runs only this module in a multi-module setup
        # -am builds dependent modules first
        run: mvn -B verify --no-transfer-progress

      # ── Node services ────────────────────────────────────────────────────
      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install & test (${{ matrix.service }})
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci
          npm test --if-present

      # Upload test reports for review in the Actions UI
      - name: Upload test results
        if: always() && matrix.runtime == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/surefire-reports/
          retention-days: 7

  # ── 2. Build and push Docker images ─────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test                       # only build if all tests pass
    # Only push images on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dir: auth
            image: ebank-auth
          - service: accounts
            dir: accounts
            image: ebank-accounts
          - service: transactions
            dir: transactions
            image: ebank-transactions
          - service: gateway
            dir: gateway
            image: ebank-gateway
          - service: notification
            dir: notifications
            image: ebank-notification
          - service: frontend
            dir: frontend
            image: ebank-frontend

    permissions:
      contents: read
      packages: write     # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build metadata: tags = latest + git SHA (short)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: reuse layers from previous builds (~60% faster)
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  # ── 3. Helm lint and template validation ────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update

      - name: Helm dependency update
        run: helm dependency update helm/ebank

      - name: Lint base values
        run: helm lint helm/ebank -f helm/ebank/values.yaml

      - name: Lint recf values
        run: helm lint helm/ebank -f helm/ebank/values.yaml -f helm/ebank/values-recf.yaml

      - name: Lint prod values
        run: helm lint helm/ebank -f helm/ebank/values.yaml -f helm/ebank/values-prod.yaml

      - name: Template dry-run (recf)
        run: |
          helm template ebank helm/ebank \
            -f helm/ebank/values.yaml \
            -f helm/ebank/values-recf.yaml \
            --set global.vault.token=ci-dummy-token \
            | kubectl apply --dry-run=client -f - 2>&1 | grep -v "^$"
        env:
          KUBECONFIG: ""
