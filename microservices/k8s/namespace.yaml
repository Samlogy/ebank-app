# ══════════════════════════════════════════════════════════════════════════════
# namespace.yaml — K8s Namespaces for each environment
#
# WHY namespaces:
#   - Hard isolation between environments (recf vs prod)
#   - RBAC can be scoped per namespace (staging team ≠ prod team)
#   - Resource quotas can be set per namespace (cap staging costs)
#   - `kubectl get pods -n ebank-prod` — clear, unambiguous context
#
# NOTE: Helm creates namespaces automatically with --create-namespace.
# This file is useful for pre-creating them with labels (e.g., for NetworkPolicy)
# or for applying ResourceQuotas.
# ══════════════════════════════════════════════════════════════════════════════

# ── Staging namespace ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ebank-recf
  labels:
    environment: recf
    team: ebank
    # This label enables Pod Security Standards enforcement
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted

---
# ── Production namespace ──────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ebank-prod
  labels:
    environment: prod
    team: ebank
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted

---
# ══════════════════════════════════════════════════════════════════════════════
# ResourceQuota — limits total resource consumption per namespace
# WHY: prevents a runaway pod from eating the entire cluster's CPU/memory.
# Adjust values based on your cluster node sizes.
# ══════════════════════════════════════════════════════════════════════════════

# Staging quota — modest limits (cheaper nodes are fine)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ebank-quota
  namespace: ebank-recf
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "30"

---
# Production quota — sized for real traffic
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ebank-quota
  namespace: ebank-prod
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    pods: "100"
