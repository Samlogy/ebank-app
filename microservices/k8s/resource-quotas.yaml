# ══════════════════════════════════════════════════════════════════════════════
# resource-quotas.yaml — ResourceQuota + LimitRange for ebank-local
#
# WHY two objects:
#   ResourceQuota  → cap the TOTAL resources consumed by the namespace
#   LimitRange     → set DEFAULT requests/limits on pods that don't specify them
#                    (without this, a pod with no limits can consume unlimited RAM)
#
# Apply:
#   kubectl apply -f k8s/resource-quotas.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── ResourceQuota — namespace-level ceiling ────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ebank-local-quota
  namespace: ebank-local
spec:
  hard:
    # ── Compute ──────────────────────────────────────────────────────────────
    # Total CPU requested by all pods in this namespace
    requests.cpu: "6"
    # Total RAM requested
    requests.memory: "10Gi"
    # Hard limits (burst ceiling)
    limits.cpu: "12"
    limits.memory: "20Gi"

    # ── Object counts ─────────────────────────────────────────────────────────
    pods: "40"
    services: "20"
    persistentvolumeclaims: "10"
    secrets: "30"
    configmaps: "30"

    # ── LoadBalancer protection ───────────────────────────────────────────────
    # Prevents accidentally creating many cloud LBs (costly)
    services.loadbalancers: "1"
    services.nodeports: "0"      # use Ingress instead of NodePort

---
# ── LimitRange — per-container defaults ──────────────────────────────────────
# If a container spec omits resources{}, K8s applies these defaults.
# Without LimitRange, containers with no limits can starve the node.
apiVersion: v1
kind: LimitRange
metadata:
  name: ebank-local-limits
  namespace: ebank-local
spec:
  limits:
    - type: Container
      # Applied when the container does not declare requests/limits
      default:            # default LIMIT  (ceiling)
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:     # default REQUEST (reserved)
        cpu: "50m"
        memory: "128Mi"
      # Hard bounds — even manually set values cannot exceed these
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "10m"
        memory: "16Mi"

    - type: Pod
      max:
        cpu: "4"
        memory: "4Gi"
