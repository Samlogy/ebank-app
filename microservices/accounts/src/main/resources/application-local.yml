server:
  port: 8080

spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/accounts_db
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
      data-locations: classpath:db/migration/V1.0.0__init.sql
  flyway:
    url: jdbc:postgresql://localhost:5432/accounts_db
    user: postgres
    password: postgres
    enabled: true
    locations: classpath:db/migration

  # redis (cache)
  data:
    redis:
      host: localhost
      port: 6379
      password: redispass
      timeout: 5000

  jpa:
    hibernate:
      ddl-auto: create-drop  # En dev, on peut recréer la base à chaque démarrage
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: ${spring.application.name}
      env: local
  tracing:
    sampling:
      probability: 1.0   # 100% local — traceId in MDC/logs, no Tempo export

    # Logging levels — pattern/format is defined in logback-spring.xml
logging:
  level:
    com.ebank.accounts: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# error handling => LOCAL
error:
  handling:
    show-details: true
    include-stacktrace: true
    include-validation-errors: true
    include-trace-id: true
    trace-id-header: X-Trace-Id