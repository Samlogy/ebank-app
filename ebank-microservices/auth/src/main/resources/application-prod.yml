# Auth Service — prod environment (Kubernetes) fallback
# (authoritative config served by Config Server)
server:
  port: 8081

spring:
  cloud:
    kubernetes:
      enabled: true
      discovery:
        enabled: true
      config:
        enabled: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

logging:
  level:
    com.ebank.auth: WARN
    org.springframework.security: WARN

error:
  handling:
    show-details: false
    include-stacktrace: false
    include-validation-errors: false
    include-trace-id: true
    trace-id-header: X-Trace-Id
