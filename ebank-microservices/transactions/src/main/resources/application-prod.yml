# Transaction Service — prod environment (Kubernetes) fallback
# (authoritative config served by Config Server)
server:
  port: 8083

spring:
  cloud:
    kubernetes:
      enabled: true
      discovery:
        enabled: true
      config:
        enabled: true

logging:
  level:
    com.ebank.transactions: WARN
    org.springframework.data.mongodb: WARN

error:
  handling:
    show-details: false
    include-stacktrace: false
    include-validation-errors: false
    include-trace-id: true
    trace-id-header: X-Trace-Id
