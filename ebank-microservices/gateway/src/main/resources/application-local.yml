server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: redispass

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: ${spring.application.name}
      env: local
  tracing:
    sampling:
      probability: 1.0

# Logging levels — pattern/format is defined in logback-spring.xml
logging:
  level:
    com.ebank.gateway: INFO
    org.springframework.cloud.gateway: INFO
