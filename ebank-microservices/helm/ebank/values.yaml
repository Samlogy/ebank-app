# ══════════════════════════════════════════════════════════════════════════════
# values.yaml — BASE defaults shared across ALL environments
# Override per-env in values-recf.yaml and values-prod.yaml
# Deploy:
#   helm upgrade --install ebank ./helm/ebank \
#     -f helm/ebank/values.yaml \
#     -f helm/ebank/values-prod.yaml \
#     --namespace ebank-prod --create-namespace
# ══════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL — values shared across all service templates
# ──────────────────────────────────────────────────────────────────────────────
global:
  # Docker registry prefix. Leave empty for Docker Hub images without org prefix.
  # Example: "ghcr.io/your-org" → image becomes "ghcr.io/your-org/ebank-auth:1.0.0"
  registry: "your-registry"

  # Image tag applied to ALL services unless overridden per-service.
  # In CI/CD, this is set to the git SHA: --set global.imageTag=${{ github.sha }}
  imageTag: "1.0.0"

  # Maps to SPRING_PROFILES_ACTIVE and Vault secret path (secret/ebank/<svc>/<env>)
  env: "prod"

  vault:
    # Vault address reachable inside the cluster
    addr: "http://vault:8200"
    # Token is stored in K8s Secret "vault-token" (see templates/vault-secret.yaml)
    # NEVER commit the real token here — use --set global.vault.token=<value> at deploy time
    tokenSecretName: "vault-token"
    tokenSecretKey: "token"

  # Internal service URLs (computed from Release.Name by Helm)
  # Services can override individual hosts if using external managed services
  services:
    postgresHost: ""   # auto-computed: <release>-postgresql
    mongoHost: ""      # auto-computed: <release>-mongodb
    redisHost: ""      # auto-computed: <release>-redis-master
    kafkaHost: ""      # auto-computed: <release>-kafka

# ──────────────────────────────────────────────────────────────────────────────
# VAULT INIT JOB — runs as post-install/post-upgrade Helm hook
# Seeds K8s-specific URLs into Vault for each service
# ──────────────────────────────────────────────────────────────────────────────
vaultInit:
  enabled: true              # set false if Vault is pre-seeded externally

# ──────────────────────────────────────────────────────────────────────────────
# AUTH SERVICE — JWT + Spring Security + PostgreSQL + Redis
# Config source: Spring Cloud Vault Config (spring.config.import: "optional:vault://")
#   Vault path: secret/ebank/auth-service + secret/ebank/auth-service/{env}
# ──────────────────────────────────────────────────────────────────────────────
auth:
  enabled: true
  image: ebank-auth
  tag: ""
  replicas: 2
  port: 8081

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "600m"
      memory: "1Gi"

  # Horizontal Pod Autoscaler
  # WHY: auth is stateless (JWT) — can scale freely without session affinity
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Stabilization: wait 5 min before scaling down to prevent flapping
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 60

  probes:
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 40
      periodSeconds: 10

# ──────────────────────────────────────────────────────────────────────────────
# ACCOUNTS SERVICE — Spring WebFlux + R2DBC (reactive) + PostgreSQL + Redis
# ──────────────────────────────────────────────────────────────────────────────
accounts:
  enabled: true
  image: ebank-accounts
  tag: ""
  replicas: 2
  port: 8082

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "600m"
      memory: "1Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 60

  probes:
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 40
      periodSeconds: 10

# ──────────────────────────────────────────────────────────────────────────────
# TRANSACTIONS SERVICE — Spring WebFlux + MongoDB + Kafka + Redis
# ──────────────────────────────────────────────────────────────────────────────
transactions:
  enabled: true
  image: ebank-transactions
  tag: ""
  replicas: 2
  port: 8083

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "600m"
      memory: "1Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 60

  probes:
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 40
      periodSeconds: 10

# ──────────────────────────────────────────────────────────────────────────────
# NOTIFICATION SERVICE — Node.js + KafkaJS + Nodemailer
# WHY no HPA by default: Kafka consumer group — scale replicas = scale partitions.
# Only scale if you've set Kafka topic partitions >= target replicas.
# ──────────────────────────────────────────────────────────────────────────────
notification:
  enabled: true
  image: ebank-notification
  tag: ""
  replicas: 1
  port: 3002

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

  probes:
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10

  # External SMTP — replace MailHog host with SendGrid/SES in prod
  smtp:
    host: "mailhog"
    port: "1025"
    from: "noreply@ebank.com"

# ──────────────────────────────────────────────────────────────────────────────
# CHATBOT SERVICE — Spring Boot + Spring AI (Tool Calling + RAG over pgvector)
# WHY env-driven (not Vault): the only secret is the LLM API key, held in a K8s Secret.
# Ships with its own pgvector Postgres (chatbot-pgvector) as the RAG store.
# ──────────────────────────────────────────────────────────────────────────────
chatbot:
  enabled: true
  image: ebank-chatbot
  tag: ""
  replicas: 1
  port: 3001

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "700m"
      memory: "1Gi"

  probes:
    liveness:
      periodSeconds: 20
    readiness:
      periodSeconds: 10

  # In-cluster URLs of the banking services the chatbot's tools call.
  accountsServiceUrl: "http://ebank-accounts:8082"
  transactionServiceUrl: "http://ebank-transactions:8083"
  otlpEndpoint: "http://tempo:4318/v1/traces"
  lokiUrl: "http://loki:3100/loki/api/v1/push"

  # Dedicated pgvector RAG store (Database-per-Service).
  pgvector:
    image: "pgvector/pgvector:pg17"
  db:
    name: "chatbot_db"
    user: "postgres"
    password: "postgres"

  # LLM backend. Create the Secret before/after install:
  #   kubectl -n <ns> create secret generic ebank-chatbot-secrets \
  #     --from-literal=openai-api-key=sk-REAL-KEY
  llm:
    baseUrl: "https://api.openai.com"
    model: "gpt-4o-mini"
    embeddingModel: "text-embedding-3-small"
    apiKeySecretName: "ebank-chatbot-secrets"
    apiKeySecretKey: "openai-api-key"

# ──────────────────────────────────────────────────────────────────────────────
# GATEWAY — Spring Cloud Gateway (sole external entry point)
# WHY high maxReplicas: gateway is the bottleneck for ALL traffic — scale aggressively
# ──────────────────────────────────────────────────────────────────────────────
gateway:
  enabled: true
  image: ebank-gateway
  tag: ""
  replicas: 2
  port: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "750m"
      memory: "1Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15
    targetCPUUtilizationPercentage: 60     # scale earlier — gateway is latency-sensitive
    targetMemoryUtilizationPercentage: 75
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 30        # react quickly to traffic spikes

  probes:
    liveness:
      initialDelaySeconds: 40
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 35
      periodSeconds: 10

  ingress:
    enabled: true
    className: nginx
    host: api.ebank.local                  # change to your real domain in prod
    tls: false                             # set true + add secretName in prod
    tlsSecretName: ebank-gateway-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

# ──────────────────────────────────────────────────────────────────────────────
# FRONTEND — React + Vite (served by nginx in container)
# ──────────────────────────────────────────────────────────────────────────────
frontend:
  enabled: true
  image: ebank-frontend
  tag: ""
  replicas: 2
  port: 80

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10

  ingress:
    enabled: true
    className: nginx
    host: ebank.local
    tls: false
    tlsSecretName: ebank-frontend-tls
    annotations: {}

# ──────────────────────────────────────────────────────────────────────────────
# BITNAMI — PostgreSQL
# Creates: <release>-postgresql service on port 5432
# Databases are created by each service's Flyway migration on startup.
# The init.sql from infra/postgres/init.sql is mounted via initdbScripts.
# ──────────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: postgres
    postgresPassword: postgres
  primary:
    persistence:
      enabled: true
      size: 10Gi
    # Mount your existing init.sql to create databases on first boot
    initdb:
      scripts:
        init.sql: |
          CREATE DATABASE auth_db;
          CREATE DATABASE accounts_db;
          CREATE DATABASE chatbot_db;

# ──────────────────────────────────────────────────────────────────────────────
# BITNAMI — MongoDB
# Creates: <release>-mongodb service on port 27017
# ──────────────────────────────────────────────────────────────────────────────
mongodb:
  enabled: true
  auth:
    enabled: true
    rootUser: mongo
    rootPassword: mongopass
  persistence:
    enabled: true
    size: 10Gi

# ──────────────────────────────────────────────────────────────────────────────
# BITNAMI — Redis (standalone mode — upgrade to sentinel/cluster for HA prod)
# Creates: <release>-redis-master service on port 6379
# WHY standalone: simpler setup; for prod HA consider architecture: replication
# ──────────────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: redispass
  master:
    persistence:
      enabled: true
      size: 5Gi

# ──────────────────────────────────────────────────────────────────────────────
# BITNAMI — Kafka (KRaft mode — no Zookeeper needed in v29+)
# Creates: <release>-kafka service on port 9092
# WHY KRaft: simpler ops (no separate Zookeeper StatefulSet to manage)
# ──────────────────────────────────────────────────────────────────────────────
kafka:
  enabled: true
  replicaCount: 1           # increase to 3 for fault-tolerant prod setup
  persistence:
    enabled: true
    size: 10Gi
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  # Auto-create topics used by the services
  extraEnvVars:
    - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
      value: "true"
    - name: KAFKA_CFG_LOG_RETENTION_HOURS
      value: "168"

# ──────────────────────────────────────────────────────────────────────────────
# RESOURCE QUOTAS + LIMIT RANGE
# quotas.enabled: false in values.yaml (override per env)
# WHY: ResourceQuota prevents one namespace from consuming all cluster resources.
#      LimitRange injects default requests/limits into containers that omit them.
# ──────────────────────────────────────────────────────────────────────────────
quotas:
  enabled: false          # enabled in values-local/recf/prod overrides

  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "16Gi"
  maxPods: "50"
  maxServices: "30"
  maxPVCs: "20"

  # Injected into containers that specify no resource block
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  defaultLimit:
    cpu: "500m"
    memory: "512Mi"

  # Hard ceiling per single container / pod
  maxPerContainer:
    cpu: "2"
    memory: "2Gi"
  maxPerPod:
    cpu: "4"
    memory: "4Gi"

# ──────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY — Prometheus ServiceMonitor + Grafana integration
# monitoring.enabled: true creates a ServiceMonitor for all ebank services
# Requires kube-prometheus-stack installed in the cluster.
# ──────────────────────────────────────────────────────────────────────────────
monitoring:
  enabled: true
  scrapeInterval: "30s"
  scrapeTimeout: "10s"
