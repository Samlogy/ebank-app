{{/*
db-migrate-job.yaml — Runs DB schema migrations for auth and accounts services.

WHY a separate Job (not relying on Flyway auto-config):
  Spring Boot 4.0 moved Flyway auto-configuration to a per-module starter
  (spring-boot-starter-flyway). Services using flyway-core alone no longer
  get auto-configuration. Running migrations from a K8s Job is the correct
  production pattern regardless — it separates migration from app startup.

WHEN it runs:
  - pre-install + pre-upgrade hook, weight "1" (after vault-init at weight "0")
  - Uses IF NOT EXISTS SQL so it is idempotent on re-runs
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ebank.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ebank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL at {{ include "ebank.postgresHost" . }}:5432..."
              until pg_isready -h {{ include "ebank.postgresHost" . }} -U postgres; do
                echo "  not ready, retrying..."; sleep 3
              done
              echo "PostgreSQL is ready."
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: migrate
          image: postgres:17-alpine
          env:
            - name: PGPASSWORD
              value: "postgres"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              PG="{{ include "ebank.postgresHost" . }}"

              echo "==> Running auth_db migrations..."
              psql -h "$PG" -U postgres -d auth_db <<'SQL'
              CREATE TABLE IF NOT EXISTS users (
                id         BIGSERIAL PRIMARY KEY,
                username   VARCHAR(50)  NOT NULL UNIQUE,
                email      VARCHAR(100) NOT NULL UNIQUE,
                password   VARCHAR(255) NOT NULL,
                role       VARCHAR(50)  NOT NULL DEFAULT 'ROLE_USER',
                active     BOOLEAN      NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP             DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP             DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX IF NOT EXISTS idx_users_email    ON users (email);
              CREATE INDEX IF NOT EXISTS idx_users_username ON users (username);
              SQL
              echo "  auth_db done."

              echo "==> Running accounts_db migrations..."
              psql -h "$PG" -U postgres -d accounts_db <<'SQL'
              CREATE TABLE IF NOT EXISTS accounts (
                id                 BIGSERIAL PRIMARY KEY,
                account_number     VARCHAR(20)   NOT NULL UNIQUE,
                account_holder_name VARCHAR(100) NOT NULL,
                email              VARCHAR(100)  NOT NULL UNIQUE,
                phone_number       VARCHAR(10),
                account_type       VARCHAR(20)   NOT NULL,
                balance            DECIMAL(15,2) NOT NULL,
                address            TEXT,
                status             VARCHAR(10)   NOT NULL,
                version            BIGINT DEFAULT 0,
                created_at         TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at         TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX IF NOT EXISTS idx_accounts_email          ON accounts(email);
              CREATE INDEX IF NOT EXISTS idx_accounts_account_number ON accounts(account_number);
              SQL
              echo "  accounts_db done."

              echo "==> DB migrations complete."
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
