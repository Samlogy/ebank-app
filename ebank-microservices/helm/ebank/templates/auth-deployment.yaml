{{- if .Values.auth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebank.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  {{- if not .Values.auth.autoscaling.enabled }}
  replicas: {{ .Values.auth.replicas }}
  {{- end }}
  {{/*
    WHY omit replicas when HPA is enabled:
    If both Deployment.spec.replicas AND HPA exist, they fight each other.
    Omitting replicas lets HPA be the sole source of truth for replica count.
  */}}
  selector:
    matchLabels:
      {{- include "ebank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ebank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum | trunc 8 }}
    spec:
      terminationGracePeriodSeconds: 30

      # Wait for Vault before Spring starts.
      # WHY: auth uses Spring Cloud Vault Config (spring.config.import: "optional:vault://")
      #      — it reads ALL its config from Vault at startup. Vault must be ready first.
      initContainers:
        {{- include "ebank.waitForVault" . | nindent 8 }}

      containers:
        - name: auth
          image: {{ include "ebank.image" (dict "service" .Values.auth "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.auth.port }}
              protocol: TCP
          env:
            {{- include "ebank.vaultEnv" . | nindent 12 }}
            {{- include "ebank.springProfileEnv" . | nindent 12 }}

          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}

          # startupProbe gates liveness — gives Spring Boot up to 5 min to start
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: {{ .Values.auth.probes.liveness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: {{ .Values.auth.probes.readiness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5
{{- end }}
