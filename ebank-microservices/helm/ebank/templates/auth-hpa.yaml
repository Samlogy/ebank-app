{{/*
auth-hpa.yaml — Horizontal Pod Autoscaler for the auth service.

HOW HPA works:
  1. metrics-server collects CPU/memory from each pod every 15s
  2. HPA controller computes: desiredReplicas = ceil(current * actual/target)
  3. If desiredReplicas != currentReplicas → scale up or down
  4. Stabilization window prevents flapping (don't scale down immediately)

WHY auth is a good HPA candidate:
  - Fully stateless (JWT — session data in Redis, not in pod)
  - CPU spikes during bcrypt password hashing (login bursts)
  - Can safely add/remove replicas with zero client impact
*/}}
{{- if and .Values.auth.enabled .Values.auth.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ebank.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ebank.fullname" . }}-auth
  minReplicas: {{ .Values.auth.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.auth.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.auth.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.auth.autoscaling.targetMemoryUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.auth.autoscaling.scaleUpStabilizationSeconds | default 60 }}
      policies:
        - type: Pods
          value: 2              # add max 2 pods per minute
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.auth.autoscaling.scaleDownStabilizationSeconds | default 300 }}
      policies:
        - type: Pods
          value: 1              # remove max 1 pod per 2 minutes (conservative)
          periodSeconds: 120
{{- end }}
