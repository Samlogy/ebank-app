{{- if .Values.chatbot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebank.fullname" . }}-chatbot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
spec:
  replicas: {{ .Values.chatbot.replicas }}
  selector:
    matchLabels:
      {{- include "ebank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chatbot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ebank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chatbot
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum | trunc 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: chatbot
          image: {{ include "ebank.image" (dict "service" .Values.chatbot "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.chatbot.port }}
              protocol: TCP
          env:
            # Chatbot is env-driven (not Vault-backed) — the LLM key lives in a Secret.
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: PORT
              value: {{ .Values.chatbot.port | quote }}
            - name: CHATBOT_DB_URL
              value: "jdbc:postgresql://{{ include "ebank.fullname" . }}-chatbot-pgvector:5432/{{ .Values.chatbot.db.name }}"
            - name: CHATBOT_DB_USER
              value: {{ .Values.chatbot.db.user | quote }}
            - name: CHATBOT_DB_PASSWORD
              value: {{ .Values.chatbot.db.password | quote }}
            - name: ACCOUNTS_SERVICE_URL
              value: {{ .Values.chatbot.accountsServiceUrl | quote }}
            - name: TRANSACTION_SERVICE_URL
              value: {{ .Values.chatbot.transactionServiceUrl | quote }}
            - name: OTLP_ENDPOINT
              value: {{ .Values.chatbot.otlpEndpoint | quote }}
            - name: LOKI_URL
              value: {{ .Values.chatbot.lokiUrl | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.chatbot.llm.baseUrl | quote }}
            - name: CHATBOT_MODEL
              value: {{ .Values.chatbot.llm.model | quote }}
            - name: CHATBOT_EMBEDDING_MODEL
              value: {{ .Values.chatbot.llm.embeddingModel | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chatbot.llm.apiKeySecretName }}
                  key: {{ .Values.chatbot.llm.apiKeySecretKey }}
                  optional: true
          resources:
            {{- toYaml .Values.chatbot.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: {{ .Values.chatbot.probes.liveness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: {{ .Values.chatbot.probes.readiness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 5
{{- end }}
