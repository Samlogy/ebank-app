{{/*
vault-secret.yaml — K8s Secret holding the Vault root token.

WHY K8s Secret and not a plain env var:
  - Secrets are base64-encoded and stored separately from Pods
  - RBAC can restrict which ServiceAccounts can read them
  - Secret values are never visible in `kubectl describe pod`

SECURITY NOTE (important for production):
  This approach (static token) is fine for dev/staging.
  For production, upgrade to Vault Kubernetes Auth Method:
    vault auth enable kubernetes
    vault write auth/kubernetes/config kubernetes_host=https://$K8S_HOST
  Then services use their ServiceAccount JWT to authenticate — no static token.

HOW TO CREATE the secret before deploying:
  kubectl create secret generic vault-token \
    --from-literal=token=<your-vault-token> \
    --namespace ebank-prod

  Or via CI/CD using a sealed secret / external secrets operator.

This template creates a PLACEHOLDER secret with value "CHANGEME".
Override it before deploying: --set global.vault.token=<real-token>
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.vault.tokenSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
  annotations:
    # keep: do not delete this secret on helm uninstall (preserves the Vault token)
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.global.vault.tokenSecretKey }}: {{ required "Set global.vault.token via --set or a sealed secret" (.Values.global.vault.token | default "CHANGEME") | quote }}
