{{/*
frontend-deployment.yaml — React 19 + Vite, served by nginx inside the container

WHY no initContainers:
  The frontend is a static SPA — it has no server-side dependencies.
  The React app calls the gateway at runtime via the browser (not from the pod).
  The VITE_API_URL env var is baked in at BUILD time (not runtime).

WHY low resource limits:
  nginx serving static files is I/O-bound with negligible CPU/memory needs.
  Most work happens in the user's browser, not the server.
*/}}
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebank.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "ebank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ebank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum | trunc 8 }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: frontend
          image: {{ include "ebank.image" (dict "service" .Values.frontend "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          # nginx serves a static index.html — probe just checks HTTP 200
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            failureThreshold: 3
            timeoutSeconds: 3
{{- end }}
