{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebank.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebank.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: ClusterIP
  selector:
    {{- include "ebank.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
  ports:
    - name: http
      port: {{ .Values.auth.port }}
      targetPort: http
      protocol: TCP
{{- end }}
