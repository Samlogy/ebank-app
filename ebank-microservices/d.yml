services:
  # Redis — Cache, sessions, rate limiting, JWT blacklist
  # WHY: JWT stateless nécessite blacklist pour révocation, cache haute perf
  # PROs: ultra-rapide (~0.1ms), TTL natif, Pub/Sub, sliding window rate limiting
  # CONs: données en mémoire (AOF/RDB pour persistence), dépendance infra
  redis:
    image: redis:7-alpine
    container_name: ebank_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispass
    volumes:
      - redis-data:/data
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # PostgreSQL — Base relationnelle partagée (database-per-service via init.sql)
  # WHY: ACID pour données critiques (comptes, auth, cartes), Flyway migrations
  # PROs: intégrité référentielle, pgvector extension, R2DBC + JDBC support
  # CONs: scalabilité horizontale complexe, instance partagée en dev (à séparer en prod)
  postgres:
    image: postgres:17-alpine
    container_name: ebank_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # MongoDB — Base documents (transactions)
  # WHY: Schéma flexible pour transactions variables, Aggregation Pipeline
  # PROs: haute performance écriture, pas de migration de schéma rigide
  # CONs: pas de jointures natives, ACID multi-docs explicite
  mongodb:
    image: mongo:7-jammy
    container_name: ebank_mongodb
    restart: always
    # environment:
      # MONGO_INITDB_ROOT_USERNAME: mongo
      # MONGO_INITDB_ROOT_PASSWORD: mongopass
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ebank-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  ebank-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  redis-data: