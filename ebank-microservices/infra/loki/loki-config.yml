# Loki — minimal single-node config for local dev / Docker Compose
# For production, switch to S3/GCS object storage and enable replication.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory:  /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention: keep logs for 7 days locally (adjust for prod)
limits_config:
  retention_period: 168h
  # Prevent label cardinality explosions
  max_label_names_per_series: 10
  max_label_value_length: 2048

# Compactor runs retention enforcement
compactor:
  working_directory: /tmp/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
