global:
  scrape_interval:     15s  # Pull metrics every 15s
  evaluation_interval: 15s  # Evaluate alerting rules every 15s
  # Common labels added to every time series scraped by this instance
  external_labels:
    cluster: ebank-local

# ================================================================
# SCRAPE CONFIGS — one job per microservice
# Each service exposes /actuator/prometheus (Spring Boot Actuator)
# ================================================================
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Spring Boot services ────────────────────────────────────────
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway-service:8080']
        labels:
          service: gateway

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
        labels:
          service: auth-service

  - job_name: accounts-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['accounts-service:8082']
        labels:
          service: accounts-service

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transaction-service:8083']
        labels:
          service: transaction-service
