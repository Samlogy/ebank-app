# Grafana datasource provisioning — auto-loaded on container start
# Grafana docs: https://grafana.com/docs/grafana/latest/administration/provisioning/
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Derived fields: extract traceId from logfmt lines → clickable link to Tempo
      derivedFields:
        - name: traceId
          matcherRegex: "traceId=(\\w+)"
          url: "${__value.raw}"
          datasourceUid: tempo    # uid matches the Tempo datasource above
