# Grafana Tempo — minimal single-node config for local dev / Docker Compose
# For production: use distributed mode with object storage (S3/GCS).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

# ── Receivers ────────────────────────────────────────────────────────────────
# Accept traces from services via OTLP (Spring Boot / Micrometer Tracing default)
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"   # OTLP gRPC
        http:
          endpoint: "0.0.0.0:4318"   # OTLP HTTP  ← used by Spring Boot services

# ── Ingester ─────────────────────────────────────────────────────────────────
ingester:
  max_block_duration: 5m             # flush to storage every 5 min

# ── Storage ──────────────────────────────────────────────────────────────────
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# ── Compactor ────────────────────────────────────────────────────────────────
compactor:
  compaction:
    block_retention: 24h             # keep traces for 24h locally

# ── Metrics generator — derives RED metrics + service graph from traces ───────
# Pushes to Prometheus via remote_write → enables Grafana Service Map
metrics_generator:
  registry:
    external_labels:
      source:  tempo
      cluster: ebank-local
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# ── Overrides ─────────────────────────────────────────────────────────────────
overrides:
  defaults:
    metrics_generator:
      # span-metrics  → rate/error/duration per operation
      # service-graphs → topology map between services
      processors: [service-graphs, span-metrics]
