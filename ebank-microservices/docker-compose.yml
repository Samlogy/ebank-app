services:

  # ================================================================
  # VAULT — HashiCorp Vault (dev mode)
  # WHY: secrets (JWT key, DB passwords) must never live in Git or env vars
  # PROs: audit trail, TTL-based rotation, fine-grained ACL per service
  # CONs: dev mode is in-memory only — use prod mode for staging/prod
  # ================================================================
  vault:
    image: hashicorp/vault:1.17
    container_name: ebank_vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ================================================================
  # VAULT INIT — Seeds secrets into Vault on first start (runs once, then exits)
  # ================================================================
  vault-init:
    image: hashicorp/vault:1.17
    container_name: ebank_vault_init
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    networks:
      - ebank-network
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault secrets enable -version=2 -path=secret kv 2>/dev/null || true

        # ================================================================
        # AUTH SERVICE
        # path: secret/ebank/auth-service/docker
        # ================================================================
        vault kv put secret/ebank/auth-service/docker \
          "server.port=8081" \
          "spring.datasource.url=jdbc:postgresql://postgres:5432/auth_db" \
          "spring.datasource.username=postgres" \
          "spring.datasource.password=postgres" \
          "spring.datasource.driver-class-name=org.postgresql.Driver" \
          "spring.jpa.hibernate.ddl-auto=none" \
          "spring.jpa.show-sql=false" \
          "spring.flyway.enabled=true" \
          "spring.flyway.locations=classpath:db/migration" \
          "spring.flyway.connect-retries=5" \
          "spring.data.redis.host=redis" \
          "spring.data.redis.port=6379" \
          "spring.data.redis.password=redispass" \
          "jwt.secret=ebank-super-secret-jwt-key-min-32-chars-2024" \
          "jwt.expiration=900000" \
          "jwt.refresh-expiration=604800000" \
          "springdoc.api-docs.path=/auth-api-docs" \
          "springdoc.swagger-ui.path=/auth-api-ui" \
          "logging.level.com.ebank.auth=DEBUG" \
          "logging.level.org.springframework.security=INFO" \
          "logging.level.org.hibernate.SQL=DEBUG" \
          "management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env" \
          "management.endpoint.health.show-details=ALWAYS" \
          "management.metrics.tags.service=auth-service" \
          "management.metrics.tags.env=docker" \
          "management.tracing.sampling.probability=1.0" \
          "management.otlp.tracing.endpoint=http://tempo:4318/v1/traces"

        # ================================================================
        # ACCOUNTS SERVICE
        # path: secret/ebank/accounts-service/docker
        # ================================================================
        vault kv put secret/ebank/accounts-service/docker \
          "server.port=8082" \
          "spring.r2dbc.url=r2dbc:postgresql://postgres:5432/accounts_db" \
          "spring.r2dbc.username=postgres" \
          "spring.r2dbc.password=postgres" \
          "spring.flyway.url=jdbc:postgresql://postgres:5432/accounts_db" \
          "spring.flyway.user=postgres" \
          "spring.flyway.password=postgres" \
          "spring.flyway.enabled=true" \
          "spring.flyway.locations=classpath:db/migration" \
          "spring.data.redis.host=redis" \
          "spring.data.redis.port=6379" \
          "spring.data.redis.password=redispass" \
          "spring.data.redis.timeout=5000" \
          "springdoc.api-docs.path=/accounts-api-docs" \
          "springdoc.swagger-ui.path=/accounts-api-ui" \
          "logging.level.com.ebank.accounts=DEBUG" \
          "logging.level.io.r2dbc.postgresql=INFO" \
          "management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env" \
          "management.endpoint.health.show-details=ALWAYS" \
          "management.metrics.tags.service=accounts-service" \
          "management.metrics.tags.env=docker" \
          "management.tracing.sampling.probability=1.0" \
          "management.otlp.tracing.endpoint=http://tempo:4318/v1/traces"

        # ================================================================
        # TRANSACTION SERVICE
        # path: secret/ebank/transaction-service/docker
        # ================================================================
        vault kv put secret/ebank/transaction-service/docker \
          "server.port=8083" \
          "spring.mongodb.uri=mongodb://mongo:mongopass@mongodb:27017/transactions_db?authSource=admin" \
          "spring.kafka.bootstrap-servers=kafka:9092" \
          "spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer" \
          "spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer" \
          "spring.data.redis.host=redis" \
          "spring.data.redis.port=6379" \
          "spring.data.redis.password=redispass" \
          "spring.data.redis.timeout=5000" \
          "springdoc.api-docs.path=/transactions-api-docs" \
          "springdoc.swagger-ui.path=/transactions-api-ui" \
          "logging.level.com.ebank.transactions=DEBUG" \
          "logging.level.org.springframework.data.mongodb=INFO" \
          "management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env" \
          "management.endpoint.health.show-details=ALWAYS" \
          "management.metrics.tags.service=transaction-service" \
          "management.metrics.tags.env=docker" \
          "management.tracing.sampling.probability=1.0" \
          "management.otlp.tracing.endpoint=http://tempo:4318/v1/traces"

        # ================================================================
        # GATEWAY
        # path: secret/ebank/gateway/docker
        # ================================================================
        vault kv put secret/ebank/gateway/docker \
          "server.port=8080" \
          "spring.data.redis.host=redis" \
          "spring.data.redis.port=6379" \
          "spring.data.redis.password=redispass" \
          "jwt.secret=ebank-super-secret-jwt-key-min-32-chars-2024" \
          "auth.service.url=http://auth-service:8081" \
          "accounts.service.url=http://accounts-service:8082" \
          "transaction.service.url=http://transaction-service:8083" \
          "chatbot.service.url=http://chatbot-service:3001" \
          "notification.service.url=http://notification-service:3002" \
          "springdoc.api-docs.path=/gateway-api-docs" \
          "springdoc.swagger-ui.path=/gateway-api-ui" \
          "logging.level.com.ebank.gateway=DEBUG" \
          "logging.level.org.springframework.cloud.gateway=INFO" \
          "management.endpoints.web.exposure.include=health,info,metrics,prometheus" \
          "management.endpoint.health.show-details=ALWAYS" \
          "management.metrics.tags.service=gateway" \
          "management.metrics.tags.env=docker" \
          "management.tracing.sampling.probability=1.0" \
          "management.otlp.tracing.endpoint=http://tempo:4318/v1/traces"

        # ================================================================
        # NOTIFICATION SERVICE
        # path: secret/ebank/notification-service/docker
        # ================================================================
        vault kv put secret/ebank/notification-service/docker \
          "port=3002" \
          "kafka.brokers=kafka:9092" \
          "kafka.groupId=notification-group" \
          "kafka.clientId=notification-service" \
          "smtp.host=mailhog" \
          "smtp.port=1025" \
          "smtp.from=noreply@ebank.com" \
          "twilio.account-sid=TEST_SID" \
          "twilio.auth-token=TEST_TOKEN" \
          "twilio.from-number=+15005550006" \
          "logging.level=debug"

        echo "==> Vault: toute la config initialisee (docker)."

  # ================================================================
  # API GATEWAY — Spring Cloud Gateway (WebFlux)
  # Point d'entrée unique pour tous les clients
  # WHY: Centralise auth JWT, rate limiting, routing, CORS, circuit breaker
  # PROs: non-bloquant, intégration Spring native, config déclarative YAML
  # CONs: plus complexe que Nginx/Kong, pas de dashboard visuel natif
  # ================================================================
  gateway-service:
    build: ./gateway
    container_name: gateway_service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
    networks:
      - ebank-network
    depends_on:
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ================================================================
  # AUTH SERVICE — Spring Boot + Spring Security + JWT
  # WHY: Service dédié à l'authentification = séparation des responsabilités
  # PROs: JWT stateless scalable, révocation via Redis blacklist
  # CONs: JWT payload visible (Base64), dépendance Redis pour révocation
  # ================================================================
  auth-service:
    build: ./auth
    container_name: auth_service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
    networks:
      - ebank-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ================================================================
  # ACCOUNTS SERVICE — Spring WebFlux + R2DBC (REACTIVE) + CQRS
  # WHY: Service critique à fort I/O → modèle réactif non-bloquant
  # PROs: scalabilité verticale max, backpressure, cohérence stack réactif
  # CONs: debugging complexe, R2DBC moins mature que JPA
  # ================================================================
  accounts-service:
    build: ./accounts
    container_name: accounts_service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
    networks:
      - ebank-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ================================================================
  # TRANSACTION SERVICE — Spring WebFlux + MongoDB + Kafka
  # WHY: MongoDB pour schéma flexible, Kafka pour événements async
  # PROs: volume élevé d'écritures, event replay, saga pattern
  # CONs: ACID multi-docs plus complexe, Kafka = overhead operationnel
  # ================================================================
  transaction-service:
    build: ./transactions
    container_name: transaction_service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
    networks:
      - ebank-network
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ================================================================
  # CHATBOT SERVICE — Spring Boot + Spring AI (Tool Calling + RAG/pgvector)
  # WHY: même stack Spring Boot que le reste de la plateforme ; Spring AI apporte
  #      ChatClient, tool-calling et un VectorStore pgvector natif pour le RAG.
  # PROs: RAG sur pgvector sans service dédié, tool-calling typé, observabilité
  #       identique aux autres services (Actuator, OTLP, Loki).
  # CONs: nécessite une clé LLM (OPENAI_API_KEY) ou un endpoint compatible (Ollama).
  # ================================================================
  chatbot-service:
    build: ./chatbot
    container_name: chatbot_service
    ports:
      - "3001:3001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 3001
      CHATBOT_DB_URL: jdbc:postgresql://postgres:5432/chatbot_db
      CHATBOT_DB_USER: postgres
      CHATBOT_DB_PASSWORD: postgres
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      LOKI_URL: http://loki:3100/loki/api/v1/push
      # ── LLM backend — override with your own key (OpenAI/Groq) or point at Ollama ──
      # export OPENAI_API_KEY=sk-... before `docker compose up`
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder-set-OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-gpt-4o-mini}
      CHATBOT_EMBEDDING_MODEL: ${CHATBOT_EMBEDDING_MODEL:-text-embedding-3-small}
    networks:
      - ebank-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ================================================================
  # NOTIFICATION SERVICE — Node.js + KafkaJS
  # WHY: Consumer Kafka léger, gestion email/SMS/push centralisée
  # PROs: KafkaJS simple, nodemailer pour email, MailHog en dev
  # CONs: mock SMS/push (pas d'intégration Twilio/FCM en dev)
  # ================================================================
  notification-service:
    build: ./notifications
    container_name: notification_service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@ebank.com
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    networks:
      - ebank-network
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ================================================================
  # INFRASTRUCTURE
  # ================================================================

  # PostgreSQL — Base relationnelle partagée (database-per-service via init.sql)
  # WHY: ACID pour données critiques (comptes, auth, cartes), Flyway migrations
  # PROs: intégrité référentielle, pgvector extension, R2DBC + JDBC support
  # CONs: scalabilité horizontale complexe, instance partagée en dev (à séparer en prod)
  postgres:
    # pgvector image = PostgreSQL 17 + the `vector` extension preinstalled,
    # required by the chatbot RAG store. Drop-in replacement for postgres:17.
    image: pgvector/pgvector:pg17
    container_name: ebank_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MongoDB — Base documents (transactions)
  # WHY: Schéma flexible pour transactions variables, Aggregation Pipeline
  # PROs: haute performance écriture, pas de migration de schéma rigide
  # CONs: pas de jointures natives, ACID multi-docs explicite
  mongodb:
    image: mongo:7-jammy
    container_name: ebank_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongopass
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ebank-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Redis — Cache, sessions, rate limiting, JWT blacklist
  # WHY: JWT stateless nécessite blacklist pour révocation, cache haute perf
  # PROs: ultra-rapide (~0.1ms), TTL natif, Pub/Sub, sliding window rate limiting
  # CONs: données en mémoire (AOF/RDB pour persistence), dépendance infra
  redis:
    image: redis:7-alpine
    container_name: ebank_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispass
    volumes:
      - redis-data:/data
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper — Coordinateur de cluster Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ebank_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ebank-network

  # Kafka — Message Broker async
  # WHY: Communication découplée entre services, event sourcing, audit trail
  # PROs: at-least-once delivery, event replay, partitionnement, consumer groups
  # CONs: complexité opérationnelle, overhead vs RabbitMQ pour faibles volumes
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ebank_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka UI — Dashboard visuel pour les topics Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ebank_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ebank-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - ebank-network

  # MailHog — Mock SMTP (dev uniquement)
  # WHY: Intercepte tous les emails en dev → interface web visuelle
  # PROs: pas de vrai SMTP, UI web sur :8025, zéro configuration
  # CONs: dev uniquement → remplacer par SendGrid/SES/Postmark en prod
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ebank_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - ebank-network

  # ================================================================
  # PROMETHEUS — Metrics collection (scrapes /actuator/prometheus on all services)
  # WHY: pull-based model — services don't need to know about Prometheus
  # PROs: reliable, resilient to service restarts, rich query language (PromQL)
  # CONs: pull model can miss very short-lived metrics — use push gateway for jobs
  # UI: http://localhost:9090
  # ================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ebank_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--enable-feature=remote-write-receiver'   # Tempo pushes span-metrics here
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ================================================================
  # TEMPO — Distributed tracing backend (receives OTLP spans from all services)
  # WHY: store and query traces to understand request flow across microservices
  # PROs: lightweight, Grafana-native, generates RED metrics + service graph
  # CONs: local storage only here — use S3/GCS in production
  # UI: Grafana → Explore → Tempo  |  direct API on :3200
  # ================================================================
  tempo:
    image: grafana/tempo:2.4.0
    container_name: ebank_tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana queries)
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver  ← Spring Boot services push here
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo
    command: -config.file=/etc/tempo/config.yml
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ================================================================
  # LOKI — Log aggregation (receives logs pushed by loki4j / pino-loki)
  # WHY: central store for all service logs, queryable via LogQL in Grafana
  # PROs: lightweight (no full-text index), label-based filtering, Grafana-native
  # CONs: weaker full-text search than ELK — use labels + logfmt for filtering
  # UI: Grafana → Explore → Loki datasource
  # ================================================================
  loki:
    image: grafana/loki:3.0.0
    container_name: ebank_loki
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - ebank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ================================================================
  # GRAFANA — Unified observability UI (Logs → Loki | Metrics → Prometheus | Traces → Tempo)
  # WHY: single pane of glass — correlate logs + metrics + traces without switching tools
  # PROs: open source, rich dashboards, alerting, auto-provisioned datasources
  # CONs: Prometheus and Tempo not yet added (steps 2 & 3)
  # UI: http://localhost:3000  (anonymous access enabled in dev)
  # ================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ebank_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - ebank-network

networks:
  ebank-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
