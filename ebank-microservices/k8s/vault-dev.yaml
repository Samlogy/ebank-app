# ══════════════════════════════════════════════════════════════════════════════
# vault-dev.yaml — HashiCorp Vault in DEV mode for local/minikube
#
# DEV mode means:
#   - In-memory storage (all secrets lost on pod restart)
#   - Root token = "root" (no unsealing needed)
#   - Starts unlocked and ready immediately
#
# WHY separate from Helm chart:
#   Vault must exist BEFORE the ebank Helm chart runs its vault-init Job.
#   Deploy this first, then run `helm install ebank`.
#
# Usage:
#   kubectl apply -f k8s/vault-dev.yaml -n ebank-local
#   kubectl wait --for=condition=ready pod -l app=vault -n ebank-local --timeout=60s
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: ebank-local
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "root"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: ebank-local
  labels:
    app: vault
spec:
  type: ClusterIP
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
