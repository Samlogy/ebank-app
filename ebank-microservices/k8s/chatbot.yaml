# ============================================================================
# eBank Chatbot — self-contained Kubernetes manifest for local Minikube testing.
#
# It deploys, in the `ebank` namespace:
#   - a dedicated pgvector Postgres (the chatbot's RAG store, Database-per-Service)
#   - the chatbot Spring Boot service (Spring AI: tool-calling + RAG)
#   - a Secret holding the LLM API key
#
# Quick start (see doc/CHATBOT_DESIGN.md → "Tester sur Minikube"):
#   minikube start
#   eval $(minikube docker-env)
#   docker build -t ebank-chatbot:1.0.0 ./chatbot
#   kubectl apply -f k8s/chatbot.yaml
#   kubectl -n ebank create secret generic ebank-chatbot-secrets \
#       --from-literal=openai-api-key=sk-REAL-KEY --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n ebank port-forward svc/chatbot-service 3001:3001
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ebank
---
# ── LLM API key (placeholder — override with a real key, see header) ───────────
apiVersion: v1
kind: Secret
metadata:
  name: ebank-chatbot-secrets
  namespace: ebank
type: Opaque
stringData:
  openai-api-key: "sk-placeholder-set-OPENAI_API_KEY"
---
# ── pgvector Postgres for the chatbot RAG store ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-pgvector
  namespace: ebank
  labels:
    app: chatbot-pgvector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-pgvector
  template:
    metadata:
      labels:
        app: chatbot-pgvector
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: chatbot_db
          # Demo storage: ephemeral. Vectors are re-ingested on restart (idempotent).
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-pgvector
  namespace: ebank
spec:
  selector:
    app: chatbot-pgvector
  ports:
    - port: 5432
      targetPort: 5432
---
# ── Chatbot service ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: ebank
  labels:
    app: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: ebank-chatbot:1.0.0
          imagePullPolicy: IfNotPresent   # image built into minikube's docker daemon
          ports:
            - containerPort: 3001
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: PORT
              value: "3001"
            - name: CHATBOT_DB_URL
              value: jdbc:postgresql://chatbot-pgvector:5432/chatbot_db
            - name: CHATBOT_DB_USER
              value: postgres
            - name: CHATBOT_DB_PASSWORD
              value: postgres
            # These point at the in-cluster banking services when the full platform
            # is deployed; harmless defaults otherwise (tools degrade gracefully).
            - name: ACCOUNTS_SERVICE_URL
              value: http://accounts-service:8082
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service:8083
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ebank-chatbot-secrets
                  key: openai-api-key
                  optional: true
            - name: OPENAI_BASE_URL
              value: https://api.openai.com
            - name: CHATBOT_MODEL
              value: gpt-4o-mini
            - name: CHATBOT_EMBEDDING_MODEL
              value: text-embedding-3-small
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "700m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 3001
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 3001
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 3001
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: ebank
spec:
  selector:
    app: chatbot
  ports:
    - port: 3001
      targetPort: 3001
