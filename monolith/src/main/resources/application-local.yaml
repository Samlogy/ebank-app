# Profile: local
# Usage:
#   SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
#   docker compose up -d postgres   ← only PostgreSQL needed, no Vault
#
# Self-contained — no Vault dependency. All values are defined directly
# here and are suitable for individual developer machines only.
# Never use these credentials in any shared or deployed environment.

spring:
  data:
    redis:
      host: localhost
      port: 6379
      # password: leave blank for local dev (no auth on the Docker Redis container)

  boot:
    admin:
      client:
        enabled: true
        url: http://localhost:8090
        instance:
          service-base-url: http://localhost:8080

  datasource:
    url: jdbc:postgresql://localhost:5432/ebank_dev
    username: ebank_user
    password: ebank_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  expiration: 86400000

admin:
  email: admin@ebank.com
  password: ChangeMe123!

rate-limiting:
  login:
    capacity: 10
    refill-minutes: 1

logging:
  level:
    root: INFO
    com.ebank: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,caches,threaddump,flyway,scheduledtasks
