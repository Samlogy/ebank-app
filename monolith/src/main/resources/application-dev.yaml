# Profile: dev
# Activated by: SPRING_PROFILES_ACTIVE=dev  (CI/CD pipeline for dev/testing deployments)
#
# All config (datasource, jwt, logging, etc.) is loaded from Vault at:
#   secret/e-bank/monolith/${VAULT_ENV_ID:E2}/config
#
# Required environment variables:
#   VAULT_HOST       — Vault server hostname
#   VAULT_ROLE_ID    — AppRole role-id (semi-public, identifies the app)
#   VAULT_SECRET_ID  — AppRole secret-id (secret, rotate at each deploy)
#
# Optional:
#   VAULT_PORT       — defaults to 8200
#   VAULT_SCHEME     — defaults to https
#   VAULT_ENV_ID     — defaults to E2

spring:
  config:
    import: "vault://"
  cloud:
    vault:
      enabled: true
      host: ${VAULT_HOST}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:https}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        default-context: "e-bank/monolith/${VAULT_ENV_ID:E2}/config"
        backend-version: 2
      connection-timeout: 5000
      read-timeout: 15000

  # Spring Boot Admin client — enabled in dev; URL resolved from env vars set in docker-compose
  boot:
    admin:
      client:
        enabled: ${SPRING_BOOT_ADMIN_ENABLED:true}
        url: ${SPRING_BOOT_ADMIN_URL:http://admin:8090}
        username: ${SPRING_BOOT_ADMIN_USERNAME:admin}
        password: ${SPRING_BOOT_ADMIN_PASSWORD:admin}
        instance:
          service-base-url: ${SPRING_APP_BASE_URL:http://app:8080}

# Full actuator surface in dev — gives admin server maximum visibility
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,caches,threaddump,flyway,scheduledtasks,conditions,configprops,beans,mappings
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      show-values: never
    loggers:
      enabled: true
    caches:
      enabled: true
