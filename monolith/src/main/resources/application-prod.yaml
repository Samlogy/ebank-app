# Profile: prod
# Activated by: SPRING_PROFILES_ACTIVE=prod  (CI/CD pipeline for production deployments)
#
# All config (datasource, jwt, admin, logging, etc.) is loaded from Vault at:
#   secret/e-bank/monolith/${VAULT_ENV_ID:E1}/config
#
# Required environment variables:
#   VAULT_HOST       — Vault server hostname
#   VAULT_ROLE_ID    — AppRole role-id (semi-public, identifies the app)
#   VAULT_SECRET_ID  — AppRole secret-id (rotate regularly, inject at deploy time)
#
# Optional:
#   VAULT_PORT       — defaults to 8200
#   VAULT_SCHEME     — defaults to https
#   VAULT_ENV_ID     — defaults to E1

spring:
  config:
    import: "vault://"
  cloud:
    vault:
      enabled: true
      host: ${VAULT_HOST}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:https}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        default-context: "e-bank/monolith/${VAULT_ENV_ID:E1}/config"
        backend-version: 2
      connection-timeout: 5000
      read-timeout: 15000

  # Spring Boot Admin client — enabled in prod; credentials injected via docker-compose / CI env vars
  boot:
    admin:
      client:
        enabled: ${SPRING_BOOT_ADMIN_ENABLED:true}
        url: ${SPRING_BOOT_ADMIN_URL:http://admin:8090}
        username: ${SPRING_BOOT_ADMIN_USERNAME:admin}
        password: ${SPRING_BOOT_ADMIN_PASSWORD:admin}
        instance:
          service-base-url: ${SPRING_APP_BASE_URL:http://app:8080}

# Tighter actuator surface in prod — only expose what Spring Boot Admin strictly needs
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      show-values: never
    loggers:
      enabled: true
