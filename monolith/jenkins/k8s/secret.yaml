# ─────────────────────────────────────────────────────────────────────────────
# SUPPLEMENTARY — for manual / emergency kubectl deployments only.
# The standard deployment path is the Helm chart at ebank-monolith/helm/.
#
# This Secret holds the Vault AppRole credentials. They are the ONLY secret
# the cluster needs; everything else (DB password, JWT config, admin creds)
# is stored in Vault and fetched at startup by the app.
#
# Create or rotate this Secret before deploying:
#   kubectl create secret generic ebank-vault-approle \
#     --from-literal=VAULT_ROLE_ID=<role-id> \
#     --from-literal=VAULT_SECRET_ID=<secret-id> \
#     --namespace ebank \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# VAULT_ROLE_ID   — semi-public, identifies the app (stable across deploys).
# VAULT_SECRET_ID — rotate on every deploy for defense-in-depth.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ebank-vault-approle
  namespace: ebank
  labels:
    app: ebank-monolith
type: Opaque
data:
  # echo -n '<value>' | base64
  VAULT_ROLE_ID:   REPLACE_BASE64_ENCODED_VALUE
  VAULT_SECRET_ID: REPLACE_BASE64_ENCODED_VALUE
