apiVersion: v1
kind: Service
metadata:
  name: ebank-monolith-service
  namespace: ebank
  labels:
    app: ebank-monolith
spec:
  # NodePort exposes a port on every Minikube node — easy to access locally
  # without needing a LoadBalancer or ingress controller.
  # Access via: minikube service ebank-monolith-service -n ebank --url
  type: NodePort
  selector:
    app: ebank-monolith
  ports:
    - name: http
      protocol: TCP
      port: 80           # Service port (cluster-internal)
      targetPort: 8080   # Container port
      nodePort: 30080    # External port on Minikube node (30000-32767 range)
