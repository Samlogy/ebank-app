# ─────────────────────────────────────────────────────────────────────────────
# SUPPLEMENTARY — for manual / emergency kubectl deployments only.
# The standard deployment path is the Helm chart at monolith/helm/.
#
# IMAGE_FULL is replaced at deploy time with envsubst:
#   IMAGE_FULL=registry/ebank-monolith:tag envsubst '$IMAGE_FULL' \
#     < deployment.yaml | kubectl apply -f -
#
# Prerequisites (apply in this order):
#   kubectl apply -f namespace.yaml
#   kubectl apply -f configmap.yaml -n ebank
#   kubectl apply -f secret.yaml    -n ebank   (AppRole creds)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebank-monolith
  namespace: ebank
  labels:
    app: ebank-monolith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ebank-monolith
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ebank-monolith
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 60

      containers:
        - name: ebank-monolith
          image: $IMAGE_FULL
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Non-secret config from ConfigMap ─────────────────────
          envFrom:
            - configMapRef:
                name: ebank-monolith-config

          # ── Vault AppRole credentials from Secret ─────────────────
          # Everything else (DB URL, password, JWT config, etc.) is
          # fetched from Vault by Spring Cloud Vault at startup.
          env:
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: ebank-vault-approle
                  key: VAULT_ROLE_ID
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: ebank-vault-approle
                  key: VAULT_SECRET_ID

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 12
            periodSeconds: 10

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}
