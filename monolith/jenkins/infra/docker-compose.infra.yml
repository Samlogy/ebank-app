networks:
  cicd-net:
    driver: bridge

volumes:
  jenkins_home:
    name: ebank_jenkins_home
  sonarqube_data:
    name: ebank_sonarqube_data
  sonarqube_extensions:
    name: ebank_sonarqube_extensions
  sonarqube_logs:
    name: ebank_sonarqube_logs
  sonarqube_db_data:
    name: ebank_sonarqube_db_data

services:

  # ── Jenkins ───────────────────────────────────────────────────────────────
  # http://localhost:8090
  # Mot de passe initial : docker exec ebank-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: ebank-jenkins:latest
    container_name: ebank-jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8090}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: >-
        -Dhudson.model.DirectoryBrowserSupport.CSP=
        -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=86400
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── SonarQube ────────────────────────────────────────────────────────────
  # http://localhost:9000   login: admin / admin (à changer au premier démarrage)
  sonarqube:
    image: sonarqube:lts-community
    container_name: ebank-sonarqube
    restart: unless-stopped
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}"
      SONAR_JDBC_USERNAME: "${SONAR_DB_USER:-sonarqube}"
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:-sonarqube_pass}"
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd-net
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

  # ── PostgreSQL pour SonarQube ─────────────────────────────────────────────
  sonarqube-db:
    image: postgres:15-alpine
    container_name: ebank-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${SONAR_DB_NAME:-sonarqube}"
      POSTGRES_USER: "${SONAR_DB_USER:-sonarqube}"
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:-sonarqube_pass}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonarqube} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
