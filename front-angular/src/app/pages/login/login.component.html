<div class="min-h-screen bg-gradient-to-br from-[#0f172a] to-slate-800 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center">
        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
        </svg>
      </div>
      <span class="text-white text-3xl font-bold tracking-tight">eBank</span>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex">
        <button
          (click)="setTab('login')"
          class="flex-1 py-4 text-sm font-semibold transition-colors"
          [class.bg-white]="tab === 'login'"
          [class.text-blue-600]="tab === 'login'"
          [class.border-b-2]="tab === 'login'"
          [class.border-blue-600]="tab === 'login'"
          [class.bg-slate-50]="tab !== 'login'"
          [class.text-slate-500]="tab !== 'login'"
          >
          Sign In
        </button>
        <button
          (click)="setTab('register')"
          class="flex-1 py-4 text-sm font-semibold transition-colors"
          [class.bg-white]="tab === 'register'"
          [class.text-blue-600]="tab === 'register'"
          [class.border-b-2]="tab === 'register'"
          [class.border-blue-600]="tab === 'register'"
          [class.bg-slate-50]="tab !== 'register'"
          [class.text-slate-500]="tab !== 'register'"
          >
          Create Account
        </button>
      </div>

      <div class="p-8">
        <!-- Error banner -->
        @if (error) {
          <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
            {{ error }}
          </div>
        }

        @if (tab === 'login') {
          <form (ngSubmit)="handleLogin()" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
              <input
                type="email"
                required
                name="loginEmail"
                [(ngModel)]="loginEmail"
                placeholder="you@example.com"
                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
              <input
                type="password"
                required
                name="loginPassword"
                [(ngModel)]="loginPassword"
                placeholder="••••••••"
                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
            </div>
            <button
              type="submit"
              [disabled]="loading"
              class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2"
              >
              @if (loading) {
                <span class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
              }
              Sign In
            </button>
          </form>
        }

        @if (tab === 'register') {
          <form (ngSubmit)="handleRegister()" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
              <input
                type="text"
                required
                name="regUsername"
                [(ngModel)]="regUsername"
                placeholder="johndoe"
                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
              <input
                type="email"
                required
                name="regEmail"
                [(ngModel)]="regEmail"
                placeholder="you@example.com"
                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
              <input
                type="password"
                required
                minlength="6"
                name="regPassword"
                [(ngModel)]="regPassword"
                placeholder="Min. 6 characters"
                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
            </div>
            <button
              type="submit"
              [disabled]="loading"
              class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2"
              >
              @if (loading) {
                <span class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
              }
              Create Account
            </button>
          </form>
        }

        <p class="mt-6 text-center text-xs text-slate-400">
          Secure Digital Banking &mdash; eBank &copy; 2024
        </p>
      </div>
    </div>
  </div>
</div>
