<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="close.emit()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-slate-900 font-semibold text-lg">New Transaction</h2>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <form (ngSubmit)="handleSubmit()" class="p-6 space-y-4">
      @if (error) {
        <div class="px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
          {{ error }}
        </div>
      }
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Type *</label>
        <select required name="type" [(ngModel)]="form.type"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          @for (t of types; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">From Account ID *</label>
        <input required name="fromAccountId" [(ngModel)]="form.fromAccountId" placeholder="Source account ID"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">To Account ID *</label>
        <input required name="toAccountId" [(ngModel)]="form.toAccountId" placeholder="Destination account ID"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Amount *</label>
        <input required type="number" min="0.01" step="0.01" name="amount" [(ngModel)]="form.amount"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
        <input name="description" [(ngModel)]="form.description" placeholder="Optional note"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="close.emit()"
          class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="loading"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 rounded-lg transition-colors flex items-center gap-2">
          @if (loading) {
            <span class="animate-spin rounded-full h-3.5 w-3.5 border-b-2 border-white"></span>
          }
          Submit
        </button>
      </div>
    </form>
  </div>
</div>
