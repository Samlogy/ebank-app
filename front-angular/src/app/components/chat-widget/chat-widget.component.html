<!-- Floating toggle button -->
<button
  (click)="toggle()"
  class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg flex items-center justify-center text-2xl z-50 transition-colors"
  aria-label="Toggle chat"
>
  <svg *ngIf="open(); else chatIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
  </svg>
  <ng-template #chatIcon>
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" />
    </svg>
  </ng-template>
</button>

<!-- Chat panel -->
<div
  *ngIf="open()"
  class="fixed bottom-24 right-6 w-96 h-[520px] bg-white rounded-2xl shadow-2xl flex flex-col z-50 border border-slate-200 overflow-hidden"
>
  <!-- Header -->
  <div class="bg-[#0f172a] px-4 py-3 flex items-center gap-3">
    <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
      </svg>
    </div>
    <div>
      <p class="text-white text-sm font-semibold">eBank Assistant</p>
      <p class="text-slate-400 text-xs">
        {{ connecting() ? 'Connecting...' : connected() ? 'Online' : 'Offline' }}
      </p>
    </div>
    <div class="ml-auto w-2 h-2 rounded-full" [class.bg-green-400]="connected()" [class.bg-slate-500]="!connected()"></div>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
    <p *ngIf="messages().length === 0 && !connecting()" class="text-slate-400 text-sm text-center mt-8">
      {{ connected() ? 'Say hello to your banking assistant!' : 'Could not connect to assistant.' }}
    </p>
    <div *ngIf="connecting()" class="flex justify-center mt-8">
      <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500"></div>
    </div>
    <div
      *ngFor="let msg of messages()"
      class="flex flex-col"
      [class.items-end]="msg.role === 'user'"
      [class.items-start]="msg.role === 'bot'"
    >
      <div
        class="max-w-[80%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed"
        [class.bg-blue-600]="msg.role === 'user'"
        [class.text-white]="msg.role === 'user'"
        [class.rounded-br-sm]="msg.role === 'user'"
        [class.bg-white]="msg.role === 'bot'"
        [class.text-slate-800]="msg.role === 'bot'"
        [class.shadow-sm]="msg.role === 'bot'"
        [class.border]="msg.role === 'bot'"
        [class.border-slate-200]="msg.role === 'bot'"
        [class.rounded-bl-sm]="msg.role === 'bot'"
      >
        {{ msg.text }}
      </div>
      <div *ngIf="msg.toolsUsed && msg.toolsUsed.length > 0" class="flex flex-wrap gap-1 mt-1 max-w-[80%]">
        <span *ngFor="let tool of msg.toolsUsed" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">
          {{ tool }}
        </span>
      </div>
    </div>
    <div #bottomAnchor></div>
  </div>

  <!-- Input -->
  <div class="p-3 border-t border-slate-200 bg-white flex gap-2">
    <input
      type="text"
      [(ngModel)]="input"
      (keydown)="handleKeyDown($event)"
      [placeholder]="connected() ? 'Type a message…' : 'Not connected'"
      [disabled]="!connected()"
      class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:cursor-not-allowed"
    />
    <button
      (click)="sendMessage()"
      [disabled]="!connected() || !input.trim()"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-sm font-medium rounded-lg transition-colors"
    >
      Send
    </button>
  </div>
</div>
